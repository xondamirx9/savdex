{% extends "admin/change_form.html" %}
{% comment %}
  Кнопка задачи (savdex/crm/admin.py, TaskAdmin): «Выполнена» или
  «Вернуть в работу». POST с токеном формы.
{% endcomment %}
{% block object-tools-items %}
  {% if can_mark %}
    <li>
      <form method="post" action="{% url 'savdex_admin:crm_task_done' original.pk %}" style="display:inline">
        {% csrf_token %}
        <button type="submit" class="button">{% if task_done %}Вернуть в работу{% else %}Выполнена{% endif %}</button>
      </form>
    </li>
  {% endif %}
  {{ block.super }}
{% endblock %}
