[project]
name = "savdex"
version = "0.1.0"
description = "Перенос площадки SavdEX с Laravel на Django"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0,<6",
    "psycopg[binary]>=3.2",
    "dj-database-url>=2.2",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "bcrypt>=4.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff>=0.7",
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1",
    "types-openpyxl>=3.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ANN", "RUF"]
# ANN101/ANN102 (self и cls) сняты в самом ruff; RUF001-003 ругаются
# на кириллицу в строках и комментариях, а комментарии здесь русские
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-annotations]
# Сигнатуры сигналов и маршрутизаторов Django заданы фреймворком:
# у **kwargs там действительно может быть что угодно
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
# Описания листов — данные, перенесённые из PHP; резать фразу посреди
# слова ради длины строки незачем
"savdex/export/sheets.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "savdex.settings"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "savdex.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
