# Blueprint для Render: New → Blueprint → выбрать этот репозиторий.
#
# APP_ENV=staging, а не production, намеренно: DemoDataSeeder отказывается
# наполнять боевую базу, а демо-стенду без выдуманных компаний и товаров
# показывать нечего. Для настоящего запуска: production и SEED_DEMO=false.
services:
  - type: web
    name: savdex
    runtime: docker
    # Тариф в файле обязан совпадать с купленным в панели: Blueprint —
    # источник истины, и plan: free здесь откатил бы оплаченный тариф
    # при следующей синхронизации.
    plan: standard
    branch: claude/website-copy-new-design-xaxsr0
    healthCheckPath: /up
    # Постоянный диск: на нём живут загрузки — логотипы компаний, фото
    # объявлений, документы. Контейнер пересоздаётся при каждом деплое,
    # и без диска всё загруженное пропадало бы. Здесь же лежит
    # database.sqlite, пока база не переехала в PostgreSQL.
    #
    # После переезда диск остаётся: загрузки никуда не делись, а файл
    # SQLite — единственный путь отката, пока новая база не отработает
    # пару недель.
    disk:
      name: savdex-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # ── Переезд на PostgreSQL, шаг 1 из 2 ────────────────────────
      #
      # База уже создана (блок databases ниже), но сайт ещё работает на
      # файле SQLite: переключать его на пустую базу нельзя. Между
      # переключением и переносом данных прошли бы минуты, и всё, что
      # посетители успели бы за них создать — регистрации, объявления,
      # оплаты, — стёр бы перенос с --truncate. Поэтому сначала данные
      # переезжают в уже существующую базу, и только потом сайт.
      #
      # Шаг 1 (этот файл): сервис видит новую базу через TARGET_DB_URL,
      # но продолжает читать и писать SQLite. В Shell сервиса:
      #
      #   php artisan migrate --database=pgsql_target --force
      #   php artisan savdex:copy-database --truncate
      #
      # Шаг 2 (после успешного переноса): заменить две строки ниже —
      # DB_DATABASE убрать, вместо неё поставить
      #
      #   - key: DB_CONNECTION
      #     value: pgsql
      #   - key: DB_URL
      #     fromDatabase:
      #       name: savdex-db
      #       property: connectionString
      #
      # и синхронизировать Blueprint. TARGET_DB_URL после этого можно
      # удалить: приёмником станет основная база.
      - key: DB_DATABASE
        value: /var/data/database.sqlite
      - key: TARGET_DB_URL
        fromDatabase:
          name: savdex-db
          property: connectionString
      # Адрес сайта. Задаётся в панели Render (Environment → APP_URL)
      # после привязки домена: https://ваш-домен, без косой черты в конце.
      #
      # Пока переменная пуста, приложение подставляет служебный адрес
      # Render — и он расходится по canonical, карте сайта, OG-тегам
      # и ссылкам в письмах, то есть домен остаётся только в адресной
      # строке. Отсюда же CanonicalHost узнаёт, куда уводить с
      # onrender.com.
      #
      # sync: false — значение спрашивается один раз при создании
      # и не перетирается при следующих деплоях.
      - key: APP_URL
        sync: false
      - key: APP_ENV
        value: staging
      - key: APP_DEBUG
        value: "false"
      - key: SEED_DEMO
        value: "true"
      # Почта и автоподтверждение адресов задаются ТОЛЬКО в панели
      # Render (Environment → Environment Variables) и здесь намеренно
      # не объявлены: переменная, описанная и в Blueprint, и в панели,
      # даёт при сохранении «Duplicate key … is not allowed».
      #
      #   DEMO_AUTO_VERIFY  — true, пока SMTP не настроен (иначе люди
      #                       упрутся в экран подтверждения без письма);
      #                       false, когда почта заработала.
      #
      #   Слать через личный Gmail нельзя: письма «от gmail.com» со
      #   ссылками на savdex.uz уходят в спам — домены расходятся,
      #   SPF/DKIM для своего домена через Gmail не настроить. Нужен
      #   транзакционный сервис (Brevo, Resend, SMTP2GO — у всех есть
      #   бесплатный тариф): в нём подтверждается домен savdex.uz
      #   (сервис выдаёт DNS-записи SPF и DKIM — добавить у регистратора,
      #   туда же TXT _dmarc «v=DMARC1; p=quarantine»), после чего:
      #   MAIL_MAILER=smtp, MAIL_HOST/PORT/USERNAME/PASSWORD — из панели
      #   сервиса, MAIL_FROM_ADDRESS=no-reply@savdex.uz,
      #   MAIL_FROM_NAME=SAVDEX.
      # Обработчика очереди на бесплатном тарифе нет — задания
      # выполняются сразу, в том же запросе.
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr

# База, в которую переезжает площадка. Создаётся заранее и стоит
# пустой, пока в неё не перенесут данные (см. шаг 1 выше).
#
# Тариф basic-256mb, а не free: бесплатная база Render удаляется через
# 30 дней и не имеет бэкапов — для данных площадки, принимающей оплату,
# это не вариант.
#
# Регион обязан совпадать с регионом веб-сервиса: иначе сайт ходит к базе
# через интернет, и к каждому запросу добавляются десятки миллисекунд.
databases:
  - name: savdex-db
    plan: basic-256mb
    databaseName: savdex
    user: savdex
    # Внешний доступ задаётся в панели (Database → Access Control) и здесь
    # не объявлен: адреса меняются чаще, чем деплоится код. После создания
    # базы список нужно проверить и оставить в нём только те адреса,
    # которым база действительно нужна, — свой и машины с отчётами.
    # Сайту внешний доступ не требуется: он ходит по внутреннему адресу.
