# Blueprint для Render: New → Blueprint → выбрать этот репозиторий.
#
# Настройки боевой площадки: APP_ENV=production и SEED_DEMO=false.
# Для демо-стенда, которому без выдуманных компаний показывать нечего,
# оба значения меняются на staging и true — но только у стенда.
services:
  - type: web
    name: savdex
    runtime: docker
    # Тариф в файле обязан совпадать с купленным в панели: Blueprint —
    # источник истины, и plan: free здесь откатил бы оплаченный тариф
    # при следующей синхронизации.
    plan: standard
    branch: claude/website-copy-new-design-xaxsr0
    healthCheckPath: /up
    # Постоянный диск: на нём живут загрузки — логотипы компаний, фото
    # объявлений, документы. Контейнер пересоздаётся при каждом деплое,
    # и без диска всё загруженное пропадало бы. Здесь же лежит старый
    # файл SQLite, с которого площадка переехала в PostgreSQL.
    disk:
      name: savdex-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # ── База ─────────────────────────────────────────────────────
      #
      # Площадка работает на PostgreSQL (блок databases ниже): в панели
      # Render заданы DB_CONNECTION=pgsql и DB_URL, без них контейнер не
      # стартует (docker/render-entrypoint.sh). Две строки ниже — память
      # о переезде с SQLite (TARGET_DB_URL была приёмником переноса);
      # Django их не читает, пока задан DJANGO_DATABASE_URL.
      - key: DB_DATABASE
        value: /var/data/database.sqlite
      - key: TARGET_DB_URL
        fromDatabase:
          name: savdex-db
          property: connectionString
      # Адрес сайта. Задаётся в панели Render (Environment → APP_URL)
      # после привязки домена: https://ваш-домен, без косой черты в конце.
      #
      # Пока переменная пуста, приложение подставляет служебный адрес
      # Render — и он расходится по canonical, карте сайта, OG-тегам
      # и ссылкам в письмах, то есть домен остаётся только в адресной
      # строке. Отсюда же CanonicalHost узнаёт, куда уводить с
      # onrender.com.
      #
      # sync: false — значение спрашивается один раз при создании
      # и не перетирается при следующих деплоях.
      - key: APP_URL
        sync: false
      # production, а не staging: на staging включаются предохранители
      # разработки — запрет ленивой загрузки связей и строгая проверка
      # массового заполнения. Они нарочно роняют страницу там, где
      # боевой сайт должен просто работать, и роняют её у живых людей.
      - key: APP_ENV
        value: production
      # Язык по умолчанию для писем, заданий очереди и админки:
      # без него сайт берёт «en», и справочники приходят на
      # английском посреди русских подписей
      - key: APP_LOCALE
        value: ru
      # Русский словарь полный, остальные четыре дописываются вручную
      # и всегда чуть отстают: без этого недостающая фраза выходит
      # на экран в виде ключа, а не текста
      - key: APP_FALLBACK_LOCALE
        value: ru
      - key: APP_DEBUG
        value: "false"
      # false на боевой площадке: иначе демонстрационные компании и
      # объявления досеваются в живую базу при каждом деплое
      - key: SEED_DEMO
        value: "false"
      # Почта и автоподтверждение адресов задаются ТОЛЬКО в панели
      # Render (Environment → Environment Variables) и здесь намеренно
      # не объявлены: переменная, описанная и в Blueprint, и в панели,
      # даёт при сохранении «Duplicate key … is not allowed».
      #
      #   DEMO_AUTO_VERIFY  — true, пока SMTP не настроен (иначе люди
      #                       упрутся в экран подтверждения без письма);
      #                       false, когда почта заработала.
      #
      #   Слать через личный Gmail нельзя: письма «от gmail.com» со
      #   ссылками на savdex.uz уходят в спам — домены расходятся,
      #   SPF/DKIM для своего домена через Gmail не настроить. Нужен
      #   транзакционный сервис (Brevo, Resend, SMTP2GO — у всех есть
      #   бесплатный тариф): в нём подтверждается домен savdex.uz
      #   (сервис выдаёт DNS-записи SPF и DKIM — добавить у регистратора,
      #   туда же TXT _dmarc «v=DMARC1; p=quarantine»), после чего:
      #   MAIL_MAILER=smtp, MAIL_HOST/PORT/USERNAME/PASSWORD — из панели
      #   сервиса, MAIL_FROM_ADDRESS=no-reply@savdex.uz,
      #   MAIL_FROM_NAME=SAVDEX.
      #
      #   Рассылка потенциальным клиентам (CRM) — НЕ через этот сервис:
      #   Brevo и ему подобные запрещают письма тем, кто не давал
      #   согласия, и закрыли бы аккаунт вместе с письмами сайта. У неё
      #   свой ящик на поддомене (например sales@team.savdex.uz в Zoho
      #   Mail или Яндекс 360) и свои переменные — тоже только в панели:
      #   PROSPECT_MAIL_MAILER=smtp, PROSPECT_MAIL_HOST/PORT/USERNAME/
      #   PASSWORD, PROSPECT_MAIL_FROM_ADDRESS, PROSPECT_MAIL_FROM_NAME;
      #   по желанию PROSPECT_MAIL_PER_DAY (100) и _PER_MINUTE (2).
      #   Без них письма рассылки не уходят. Подробно — docs/prospects.md.
      # Кэш — в файлах, а не в базе.
      #
      # Умолчание — database, и оно означает, что каждое
      # чтение кэша это запрос к PostgreSQL. Замер на странице
      # объявления: 38 запросов, из них 14 — обращения к кэшу.
      # То есть средство, которое существует ради разгрузки базы,
      # давало ей больше трети всей нагрузки страницы.
      #
      # Файловый кэш лежит на диске контейнера и теряется при
      # перезапуске — это нормально, кэш на то и кэш. Важнее, что
      # чтение больше не занимает соединение с базой.
      #
      # Оговорка на будущее: при numInstances больше единицы у каждого
      # экземпляра будет свой файловый кэш, и правка настройки дойдёт
      # до второго через сутки. Понадобится второй экземпляр — кэш
      # переезжает в Render Key Value, а не обратно в базу.
      - key: CACHE_STORE
        value: file
      # Обработчика очереди на бесплатном тарифе нет — задания
      # выполняются сразу, в том же запросе.
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr

# База площадки.
#
# Тариф basic-256mb, а не free: бесплатная база Render удаляется через
# 30 дней и не имеет бэкапов — для данных площадки, принимающей оплату,
# это не вариант.
#
# Регион обязан совпадать с регионом веб-сервиса: иначе сайт ходит к базе
# через интернет, и к каждому запросу добавляются десятки миллисекунд.
databases:
  - name: savdex-db
    plan: basic-256mb
    databaseName: savdex
    user: savdex
    # Внешний доступ задаётся в панели (Database → Access Control) и здесь
    # не объявлен: адреса меняются чаще, чем деплоится код. После создания
    # базы список нужно проверить и оставить в нём только те адреса,
    # которым база действительно нужна, — свой и машины с отчётами.
    # Сайту внешний доступ не требуется: он ходит по внутреннему адресу.
