<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMid slice">
  <!-- Стилизованный порт: небо, краны, контейнеровоз, штабели контейнеров.
       Тона тёмно-синие — поверх ложится текст первого экрана. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2347"/>
      <stop offset="0.65" stop-color="#0a1c3c"/>
      <stop offset="1" stop-color="#081228"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2148"/>
      <stop offset="1" stop-color="#060e20"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a56db" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a56db" stop-opacity="0.28"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="640" fill="url(#sky)"/>
  <circle cx="1310" cy="120" r="230" fill="url(#glow)" opacity="0.6"/>
  <rect y="470" width="1600" height="170" fill="url(#sea)"/>

  <!-- Дальние краны -->
  <g stroke="#16376b" stroke-width="7" opacity="0.55" fill="none">
    <path d="M980 470V210h150M980 260l150-50M1035 470V212M1130 210v50"/>
    <path d="M1490 470V190h-140M1490 240l-140-50M1435 470V192"/>
  </g>
  <g stroke="#1d4176" stroke-width="9" opacity="0.85" fill="none">
    <path d="M1240 470V150h180M1240 210l180-60M1305 470V152M1420 150v70"/>
  </g>

  <!-- Штабели контейнеров на причале -->
  <g opacity="0.9">
    <g transform="translate(890,388)">
      <rect x="0" y="56" width="130" height="26" rx="2" fill="#173a70"/>
      <rect x="0" y="28" width="130" height="26" rx="2" fill="#b45309"/>
      <rect x="0" y="0"  width="130" height="26" rx="2" fill="#134e4a"/>
      <rect x="140" y="56" width="130" height="26" rx="2" fill="#7f1d1d"/>
      <rect x="140" y="28" width="130" height="26" rx="2" fill="#1e3a8a"/>
      <rect x="280" y="56" width="130" height="26" rx="2" fill="#3f6212"/>
      <rect x="280" y="28" width="130" height="26" rx="2" fill="#173a70"/>
      <rect x="420" y="56" width="130" height="26" rx="2" fill="#1e3a8a"/>
      <rect x="560" y="56" width="130" height="26" rx="2" fill="#9a3412"/>
      <rect x="560" y="28" width="130" height="26" rx="2" fill="#334155"/>
    </g>
  </g>

  <!-- Контейнеровоз -->
  <g transform="translate(150,300)">
    <path d="M0 170 L46 236 H960 L1010 170 Z" fill="#0e2547"/>
    <rect x="60" y="140" width="880" height="34" rx="3" fill="#123058"/>
    <g>
      <rect x="120" y="112" width="118" height="26" rx="2" fill="#b45309"/>
      <rect x="246" y="112" width="118" height="26" rx="2" fill="#1e40af"/>
      <rect x="372" y="112" width="118" height="26" rx="2" fill="#7f1d1d"/>
      <rect x="498" y="112" width="118" height="26" rx="2" fill="#3f6212"/>
      <rect x="624" y="112" width="118" height="26" rx="2" fill="#155e75"/>
      <rect x="750" y="112" width="118" height="26" rx="2" fill="#9a3412"/>
      <rect x="120" y="84" width="118" height="26" rx="2" fill="#134e4a"/>
      <rect x="246" y="84" width="118" height="26" rx="2" fill="#9a3412"/>
      <rect x="372" y="84" width="118" height="26" rx="2" fill="#1e3a8a"/>
      <rect x="498" y="84" width="118" height="26" rx="2" fill="#7c2d12"/>
      <rect x="624" y="84" width="118" height="26" rx="2" fill="#334155"/>
      <rect x="246" y="56" width="118" height="26" rx="2" fill="#155e75"/>
      <rect x="372" y="56" width="118" height="26" rx="2" fill="#b45309"/>
      <rect x="498" y="56" width="118" height="26" rx="2" fill="#1e40af"/>
    </g>
    <!-- Надстройка -->
    <rect x="852" y="30" width="74" height="110" rx="3" fill="#1b3d6e"/>
    <rect x="862" y="42" width="54" height="10" rx="2" fill="#2c5c9e"/>
    <rect x="862" y="60" width="54" height="10" rx="2" fill="#2c5c9e"/>
    <rect x="884" y="6" width="8" height="24" fill="#1b3d6e"/>
  </g>

  <!-- Отражения на воде -->
  <g stroke="#1a3f78" stroke-width="4" opacity="0.35" stroke-linecap="round">
    <path d="M240 560h180M520 588h240M900 566h150M1180 596h190M60 596h120M1380 556h140"/>
  </g>
  <g stroke="#245090" stroke-width="3" opacity="0.25" stroke-linecap="round">
    <path d="M340 610h220M760 612h180M1080 576h120M160 570h90"/>
  </g>
</svg>
