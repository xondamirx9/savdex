# Сборка боевого образа и сквозные проверки внутри него: выгрузка,
# выдача прав и запуск контейнера целиком (сайт и Django за Apache).
#
# Docker на машине разработчика есть не всегда, а ошибка в Dockerfile
# на Render означает несостоявшийся деплой. Поэтому образ собирается
# здесь, до слияния, и в нём прогоняется тот же путь, что у кнопки
# «Выгрузить сейчас»: миграции, PHP-выгрузка, теневая Python-выгрузка,
# сверка книг. Проверяется не «собралось», а «работает в том, что
# уедет на сервер»: Python на месте, пакеты по uv.lock стоят, PHP видит
# Python, обе версии достают до базы.
name: docker

on:
  push:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'composer.lock'
      - 'package-lock.json'
      - 'python/pyproject.toml'
      - 'python/uv.lock'
      - 'python/savdex/**'
      - 'app/Support/DatabaseExports.php'
      - 'app/Console/Commands/ExportWorkbooks.php'
      - 'app/Console/Commands/ExportRun.php'
      - 'config/exports.php'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'composer.lock'
      - 'package-lock.json'
      - 'python/pyproject.toml'
      - 'python/uv.lock'
      - 'python/savdex/**'
      - 'app/Support/DatabaseExports.php'
      - 'app/Console/Commands/ExportWorkbooks.php'
      - 'app/Console/Commands/ExportRun.php'
      - 'config/exports.php'
      - '.github/workflows/docker.yml'

jobs:
  image:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: savdex
          POSTGRES_PASSWORD: savdex
          POSTGRES_DB: savdex_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Сборка образа
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: savdex:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Python в образе
        run: |
          docker run --rm --entrypoint /var/www/html/python/.venv/bin/python savdex:ci \
            -c "import django, openpyxl, psycopg, httpx, bcrypt, whitenoise, PIL, cryptography; print('Django', django.get_version())"

      # Ключ одноразовый, живёт только в этом прогоне
      - name: Выгрузка как по кнопке и выдача прав — внутри образа
        run: |
          docker run --rm --network host \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e DB_CONNECTION=pgsql \
            -e DB_URL=postgres://savdex:savdex@127.0.0.1:5432/savdex_test \
            -e DJANGO_DATABASE_URL=postgres://savdex:savdex@127.0.0.1:5432/savdex_test \
            -e CACHE_STORE=array -e SESSION_DRIVER=array -e QUEUE_CONNECTION=sync \
            --entrypoint bash savdex:ci -c '
              set -eo pipefail
              php artisan migrate --force
              php artisan db:seed --force
              php artisan savdex:export-run | tee /tmp/run.txt
              grep -q "Итог: done" /tmp/run.txt
              grep -q "Сверка с Python: match" /tmp/run.txt
              grep -q "Книги отдала версия: python" /tmp/run.txt
              cd python
              BCRYPT_ROUNDS=4 .venv/bin/python manage.py admin ci@savdex.uz --role=support | tee /tmp/admin.txt
              grep -q "Администратор создан" /tmp/admin.txt
            '

      # Контейнер целиком, как его запускает Render: скрипт запуска,
      # Apache, очередь, планировщик и Django за Apache. Laravel должен
      # отвечать на своих адресах, Django — на своих (распределитель,
      # docker/apache-python.conf). База уже подготовлена шагом выше.
      - name: Контейнер как на Render — сайт и Django за Apache
        run: |
          docker run -d --name savdex --network host \
            -e PORT=18080 \
            -e APP_URL=http://127.0.0.1:18080 \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e DB_CONNECTION=pgsql \
            -e DB_URL=postgres://savdex:savdex@127.0.0.1:5432/savdex_test \
            -e DJANGO_DATABASE_URL=postgres://savdex:savdex@127.0.0.1:5432/savdex_test \
            -e CACHE_STORE=array -e SESSION_DRIVER=array -e QUEUE_CONNECTION=sync \
            savdex:ci

          for i in $(seq 1 90); do
            curl -fsS -o /dev/null http://127.0.0.1:18080/up && break
            sleep 2
          done

          set -x
          curl -fsS -o /dev/null http://127.0.0.1:18080/up
          test "$(curl -fsS http://127.0.0.1:18080/py/up)" = ok
          # Админка Django без входа уводит за пропуском в Laravel —
          # значит, ключи из APP_KEY выведены и вход включён
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://127.0.0.1:18080/py/admin/)" \
            = "302 http://127.0.0.1:18080/admin/python?next=/py/admin/"
          # Стили админки Django собраны при сборке и отдаются через Apache
          curl -fsS -o /dev/null http://127.0.0.1:18080/py/static/admin/css/base.css
          # Страницы сайта на Django (этап 3): «Помощь» отдаёт Django — без
          # заголовка PHP, со страницей Inertia; смену языка (?hl=) — Laravel
          curl -fsS -D /tmp/help.h -o /tmp/help.html http://127.0.0.1:18080/help
          ! grep -qi '^x-powered-by: php' /tmp/help.h
          grep -q '"component":"DocPage"' /tmp/help.html
          curl -s -D - -o /dev/null 'http://127.0.0.1:18080/help?hl=ru' | grep -qi '^x-powered-by: php'
          # Новости и «О компании» — тоже Django
          for page in news about contact; do
            curl -fsS -D /tmp/page.h -o /dev/null "http://127.0.0.1:18080/$page"
            ! grep -qi '^x-powered-by: php' /tmp/page.h
          done

      - name: Журнал контейнера
        if: always()
        run: docker logs savdex 2>&1 | tail -60 || true
