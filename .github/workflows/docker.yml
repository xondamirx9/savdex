# Сборка боевого образа и сквозные проверки внутри него: схема,
# справочники, выгрузка, администратор и запуск контейнера целиком
# (Apache и Django за ним).
#
# Docker на машине разработчика есть не всегда, а ошибка в Dockerfile
# на Render означает несостоявшийся деплой. Поэтому образ собирается
# здесь, до слияния, и проверяется не «собралось», а «работает в том,
# что уедет на сервер». С этапа 8 PHP в образе нет: всё — Django.
name: docker

on:
  push:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'resources/**'
      - 'public/**'
      - 'python/pyproject.toml'
      - 'python/uv.lock'
      - 'python/savdex/**'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'resources/**'
      - 'public/**'
      - 'python/pyproject.toml'
      - 'python/uv.lock'
      - 'python/savdex/**'
      - '.github/workflows/docker.yml'

jobs:
  image:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: savdex
          POSTGRES_PASSWORD: savdex
          POSTGRES_DB: savdex_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Сборка образа
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: savdex:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Python в образе
        run: |
          docker run --rm --entrypoint /var/www/html/python/.venv/bin/python savdex:ci \
            -c "import django, openpyxl, psycopg, httpx, bcrypt, whitenoise, PIL, cryptography, gunicorn; print('Django', django.get_version())"
          # PHP в образе нет (этап 8), и его файлов в public/ тоже: Apache
          # без PHP отдал бы index.php как текст
          docker run --rm --entrypoint bash savdex:ci -c '
            set -e
            ! command -v php
            test ! -e /var/www/html/public/index.php
            test ! -e /var/www/html/public/.htaccess
            test ! -e /var/www/html/public/js/filament
            test ! -e /var/www/html/vendor
            test -s /var/www/html/public/build/manifest.json
            test -s /var/www/html/resources/legal/documents.json
            apache2ctl -M 2>/dev/null | grep -q proxy_http_module
            apache2ctl -M 2>/dev/null | grep -q mpm_event_module
          ' 
          # Тип загруженного файла — libmagic, как finfo у PHP: без него docx и xlsx не пройдут
          docker run --rm --entrypoint /var/www/html/python/.venv/bin/python \
            -w /var/www/html/python savdex:ci \
            -c "from savdex.web.filetype import _magic, mime_type; assert _magic() is not None; print(mime_type(b'%PDF-1.4'))"

      # Ключ одноразовый, живёт только в этом прогоне
      - name: Схема, справочники, выгрузка и администратор — внутри образа
        run: |
          docker run --rm --network host \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e DJANGO_DATABASE_URL=postgres://savdex:savdex@127.0.0.1:5432/savdex_test \
            -w /var/www/html/python \
            --entrypoint bash savdex:ci -c '
              set -eo pipefail
              .venv/bin/python manage.py schema | tee /tmp/schema.txt
              grep -q "Схема создана" /tmp/schema.txt
              .venv/bin/python manage.py seed --fresh | tee /tmp/seed.txt
              grep -q "countries 33" /tmp/seed.txt
              # Повторный запуск (каждый деплой) ничего не ломает
              .venv/bin/python manage.py schema | tee /tmp/schema.txt
              grep -q "снимок не нужен" /tmp/schema.txt
              # Выгрузка в Excel — как кнопка «Выгрузить сейчас» (шаг 68)
              .venv/bin/python manage.py run_export | tee /tmp/run.txt
              grep -q "\.xlsx" /tmp/run.txt
              BCRYPT_ROUNDS=4 .venv/bin/python manage.py admin ci@savdex.uz --role=support | tee /tmp/admin.txt
              grep -q "Администратор создан" /tmp/admin.txt
            '

      # Контейнер целиком, как его запускает Render: скрипт запуска,
      # Apache, Django за ним и фоновые задачи. База уже подготовлена
      # шагом выше — скрипт запуска её только досеивает.
      - name: Контейнер как на Render — Apache и Django
        run: |
          docker run -d --name savdex --network host \
            -e PORT=18080 \
            -e APP_URL=http://127.0.0.1:18080 \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e DB_CONNECTION=pgsql \
            -e DB_URL=postgres://savdex:savdex@127.0.0.1:5432/savdex_test \
            -e DJANGO_DATABASE_URL=postgres://savdex:savdex@127.0.0.1:5432/savdex_test \
            savdex:ci

          for i in $(seq 1 90); do
            curl -fsS -o /dev/null http://127.0.0.1:18080/up && break
            sleep 2
          done

          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          to() { curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$@"; }

          set -x
          curl -fsS -o /dev/null http://127.0.0.1:18080/up
          test "$(curl -fsS http://127.0.0.1:18080/py/up)" = ok
          # Админка Django без входа уводит на свою страницу входа (шаг 67) —
          # значит, ключи из APP_KEY выведены и вход включён
          test "$(to http://127.0.0.1:18080/py/admin/)" \
            = "302 http://127.0.0.1:18080/py/admin/login/?next=/py/admin/"
          curl -fsS -o /tmp/login.html http://127.0.0.1:18080/py/admin/login/
          grep -q 'name="_token"' /tmp/login.html
          test "$(to http://127.0.0.1:18080/py/admin/exports/)" \
            = "302 http://127.0.0.1:18080/py/admin/login/?next=/py/admin/exports/"
          # Бывшая панель Filament — в админку Django (этап 8)
          test "$(to http://127.0.0.1:18080/admin/login)" = "302 http://127.0.0.1:18080/py/admin/login/"
          test "$(to http://127.0.0.1:18080/admin)" = "302 http://127.0.0.1:18080/py/admin/"
          test "$(to http://127.0.0.1:18080/admin/excel-exports)" = "302 http://127.0.0.1:18080/py/admin/"
          test "$(code http://127.0.0.1:18080/livewire/livewire.js)" = 404
          # Стили админки Django собраны при сборке
          curl -fsS -o /dev/null http://127.0.0.1:18080/py/static/admin/css/base.css
          # Готовые файлы отдаёт сам Apache: собранный фронтенд, фавикон
          asset="$(docker exec savdex sh -c 'ls /var/www/html/public/build/assets | grep -m1 "\.css$"')"
          curl -fsS -D /tmp/asset.h -o /dev/null "http://127.0.0.1:18080/build/assets/$asset"
          grep -qi '^content-type: text/css' /tmp/asset.h
          curl -fsS -o /dev/null http://127.0.0.1:18080/favicon.ico
          # index.php больше нет — адрес как любой другой, 404 Django
          test "$(code http://127.0.0.1:18080/index.php)" = 404
          # Загрузки по /storage/… — ссылка на storage/app/public
          docker exec savdex sh -c 'mkdir -p /var/www/html/storage/app/public/ci && echo ok > /var/www/html/storage/app/public/ci/probe.txt'
          test "$(curl -fsS http://127.0.0.1:18080/storage/ci/probe.txt)" = ok
          # Неизвестный адрес — страница 404 сайта (Inertia «Error»), не Django по умолчанию
          curl -s -D /tmp/404.h -o /tmp/404.html http://127.0.0.1:18080/no/such/page
          grep -q '^HTTP/1.1 404' /tmp/404.h
          grep -q '"component":"Error"' /tmp/404.html
          # Хвостовой «/» — на адрес без него
          test "$(to http://127.0.0.1:18080/about/)" = "301 http://127.0.0.1:18080/about"
          # /index.php/<адрес> — на чистый адрес
          test "$(to http://127.0.0.1:18080/index.php/about)" = "301 http://127.0.0.1:18080/about"
          # Служебный адрес Render — на свой домен (CanonicalHost)
          test "$(to -H 'Host: savdex-ci.onrender.com' http://127.0.0.1:18080/about)" \
            = "301 http://127.0.0.1:18080/about"
          # Страницы сайта: «Помощь», смена языка (?hl=)
          curl -fsS -o /tmp/help.html http://127.0.0.1:18080/help
          grep -q '"component":"DocPage"' /tmp/help.html
          test "$(to 'http://127.0.0.1:18080/help?hl=uz')" = "302 http://127.0.0.1:18080/uz/help"
          for page in news about contact countries partners terms privacy pricing reviews \
              resumes it-services companies catalog 'catalog?type=tender' 'catalog?type=supply' \
              robots.txt sitemap.xml sitemap-static.xml services/it 'catalog?hl=de'; do
            curl -fsS -o /dev/null "http://127.0.0.1:18080/$page"
          done
          # Сессия в формате Laravel — гостю кука сессии и XSRF-TOKEN
          curl -fsS -D /tmp/about.h -o /dev/null http://127.0.0.1:18080/about
          grep -qi '^set-cookie: laravel-session=' /tmp/about.h
          grep -qi '^set-cookie: XSRF-TOKEN=' /tmp/about.h
          # Кабинет и форма отзыва: гостя — на вход
          test "$(to http://127.0.0.1:18080/cabinet)" = "302 http://127.0.0.1:18080/login"
          test "$(to http://127.0.0.1:18080/reviews/new)" = "302 http://127.0.0.1:18080/login"
          # Форма без токена — 419, как у Laravel, а не 403 CSRF Django
          test "$(code -X POST http://127.0.0.1:18080/login)" = 419
          test "$(code -X POST -d '_method=DELETE' http://127.0.0.1:18080/cabinet/listings/1)" = 419
          # Вход и регистрация
          for page in login register forgot-password reset-password/abc; do
            curl -fsS -o /tmp/auth.html "http://127.0.0.1:18080/$page"
            grep -q '"component":"auth' /tmp/auth.html
          done
          test "$(to http://127.0.0.1:18080/register/code)" = "302 http://127.0.0.1:18080/register"
          # Главная
          curl -fsS -o /tmp/home.html http://127.0.0.1:18080/
          grep -q '"component":"Home"' /tmp/home.html
          # Старый адрес /tenders, тарифы с промокодом
          test "$(to 'http://127.0.0.1:18080/tenders?closed=1')" \
            = "301 http://127.0.0.1:18080/catalog?type=tender&closed=1"
          curl -fsS -o /tmp/promo.html 'http://127.0.0.1:18080/pricing?promo=TEST'
          grep -q '"promoError"' /tmp/promo.html
          # Ничего из этого не ответило 500
          for page in listing/nothing tenders/nothing og/listing/1.jpg s/nothing \
              it-services/nothing resume/nothing company/nothing it-services/files/1 \
              countries/uz/companies cabinet/contacts/export; do
            test "$(code "http://127.0.0.1:18080/$page")" -lt 500
          done
          test "$(code -X POST http://127.0.0.1:18080/payments/uzum/callback/check)" -lt 500
          # Фоновые задачи Django запущены: расписание, перевод, сверка денег,
          # рассылка уведомлений
          for task in schedule translate reconcile_billing notify; do
            docker exec savdex sh -c "grep -al manage.py /proc/[0-9]*/cmdline | xargs -r cat | tr '\\0' ' ' | grep -q 'manage.py $task'"
          done
          # Админка — свой процесс gunicorn (127.0.0.1:8002). Убитая, она
          # отвечает 502/503 только на своих адресах, сайт работает дальше,
          # а через несколько секунд она поднимается снова. «800[2]» — чтобы
          # под шаблон не попал сам этот sh и grep
          docker exec savdex sh -c 'for p in /proc/[0-9]*; do
            grep -qa "127.0.0.1:800[2]" "$p/cmdline" 2>/dev/null \
              && [ "$(cat "$p/comm")" != runuser ] && kill -KILL "${p#/proc/}"
          done; true'
          # 502 — если Apache пробовал уже открытое соединение, 503 — новое
          case "$(code http://127.0.0.1:18080/py/admin/login/)" in 502|503) ;; *) false ;; esac
          test "$(curl -fsS http://127.0.0.1:18080/py/up)" = ok
          curl -fsS -o /tmp/home.html http://127.0.0.1:18080/
          grep -q '"component":"Home"' /tmp/home.html
          for i in $(seq 1 30); do
            test "$(code http://127.0.0.1:18080/py/admin/login/)" = 200 && break
            sleep 2
          done
          test "$(code http://127.0.0.1:18080/py/admin/login/)" = 200

      - name: Журнал контейнера
        if: always()
        run: docker logs savdex 2>&1 | tail -60 || true
