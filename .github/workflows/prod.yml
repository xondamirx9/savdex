# Боевые машины в Uztelecom Cloud: сайт; админка и фоновые задачи; база,
# общая папка файлов и кэша (deploy/README.md).
#
# Выкладка — релизами, только по кнопке: Actions → prod → Run workflow.
# Слияние в основную ветку уходит только на тестовый сервер (staging.yml);
# на боевой — пачкой всё, что накопилось с прошлого релиза.
#
# Что выкладывается — КАНДИДАТ: последний коммит основной ветки, который
# прошёл «CI» и проверку снаружи на тестовом (запись в GitHub →
# Environments → staging, её делает staging.yml). Не конец основной
# ветки: слитое позже, ещё не проверенное на тестовом, ждёт следующего
# релиза. Поле «ref» — выложить другую ветку или коммит в обход кандидата
# (на крайний случай; в сводке — предупреждение).
#
# Образ — тот же, что работал на тестовом: копируется с тестового сервера
# (docker save → load, проверка по ID образа). Нет его там — собирается
# на машине админки заново, с предупреждением.
#
# Перед схемой базы — копия базы в хранилище с меткой release
# (deploy/server/backup.sh db release). Не снялась — релиз останавливается
# до любых изменений; галочка «без копии базы» — на крайний случай.
#
# Что вошло в релиз — в сводке запуска (Summary): список слитых PR с
# прошлого релиза. Удачный релиз — запись в GitHub → Environments →
# production: по ней следующий релиз считает, что нового.
#
# Что делает (галочки):
# - «bootstrap» — подготовить чистые машины (deploy/server/bootstrap.sh
#   с ролями web, admin, db): Docker, файрвол, SSH по ключу, общая папка
#   файлов (NFS) на машине базы;
# - «настройки с Render» — перенести переменные окружения службы Render
#   (APP_KEY, почта, оплата, Telegram…) на машины сайта и админки, по SSH
#   и без вывода значений в журнал (deploy/server/render-env.py);
# - «копия с Render» — база и загруженные файлы с Render на новые
#   машины. Данные новых машин стираются, поэтому нужно ещё и слово «да»
#   в поле подтверждения; после переезда (PROD_LIVE=true) — запрещено;
# - каждый запуск — база (prod-db.sh, копии в S3 по расписанию), сборка
#   образа на машине админки и отправка его на машину сайта
#   (prod-build.sh), схема базы, админка, сайт (prod-app.sh).
#
# В GitHub Actions машины видны так: машина сайта — по публичному IP
# сети savdex-prod (на неё переадресованы порты 22, 80 и 443), машины
# админки и базы — через неё (ProxyJump) по частным адресам.
#
# Секреты и переменные (Settings → Secrets and variables → Actions):
#   secrets.DEPLOY_SSH_KEY       тот же ключ, что у тестового; открытая часть — в машинах
#   secrets.STAGING_PASSWORD     пароль на сайт на время репетиции (логин savdex)
#   secrets.BACKUP_DATABASE_URL  база Render — для «копии с Render»
#   secrets.BACKUP_PASSPHRASE    пароль шифрования копий (docs/backups.md)
#   secrets.S3_ACCESS_KEY, S3_SECRET_KEY, vars.S3_ENDPOINT — хранилище Uztelecom
#   secrets.HC_PING_DB, HC_PING_FILES  сигналы копий в Healthchecks.io (docs/monitoring.md)
#   vars.GRAFANA_PROM_URL, GRAFANA_PROM_USER, secrets.GRAFANA_ALLOY_TOKEN — агент
#                                мониторинга Grafana Alloy (docs/monitoring.md)
#   vars.RENDER_SSH              адрес SSH службы Render — настройки и файлы
#   vars.PROD_HOST               публичный IP сети savdex-prod
#   vars.PROD_WEB_IP, PROD_ADMIN_IP, PROD_DB_IP  частные адреса машин (10.…)
#   vars.PROD_DOMAIN             адрес сайта; не savdex.uz — сайт под паролем
#   vars.PROD_KNOWN_HOSTS        ключи машин (строки known_hosts) — подскажет первый запуск
#   vars.PROD_LIVE               true после переезда: «копия с Render» запрещена
#   vars.STAGING_HOST, STAGING_HOST_KEY  тестовый сервер — образ берётся с него
#
# Репозиторий публичный, журналы Actions видят все: пароли, ключи и
# значения настроек в журнал не выводятся.
name: prod

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ветка или коммит в обход кандидата (пусто — кандидат с тестового)'
        required: false
        default: ''
      no_backup:
        description: 'Без копии базы перед релизом (только если копия не снимается)'
        type: boolean
        default: false
      bootstrap:
        description: 'Сначала подготовить чистые машины'
        type: boolean
        default: false
      render_env:
        description: 'Перенести настройки (переменные окружения) с Render'
        type: boolean
        default: false
      render_data:
        description: 'Копия базы и файлов с Render (данные новых машин стираются)'
        type: boolean
        default: false
      confirm:
        description: 'Для копии с Render — напишите «да»'
        required: false
        default: ''

concurrency:
  group: prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Что выкладывается: кандидат с тестового (или «ref» в обход) и что
  # вошло в релиз — слитое с прошлого релиза
  plan:
    if: vars.PROD_HOST != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Основная ветка целиком: кандидат и прошлый релиз — её коммиты
          fetch-depth: 0
          persist-credentials: false

      - name: Что выкладывается
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          main=$(git rev-parse HEAD)

          # Последняя удачная запись выкладки в окружение (staging,
          # production) — её коммит; нет — пусто
          last_deployment() {
            local env="$1" id sha state
            while read -r id sha; do
              state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state // ""')
              if [ "$state" = success ]; then
                echo "$sha"
                return 0
              fi
            done < <(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=$env&per_page=30" \
                       --jq '.[] | "\(.id) \(.sha)"')
          }

          if [ -n "$REF" ]; then
            sha=$(git rev-parse --verify -q "origin/$REF^{commit}" || git rev-parse --verify -q "$REF^{commit}" || true)
            if [ -z "$sha" ]; then
              echo "::error::Нет ветки или коммита «$REF»"
              exit 1
            fi
            echo "::warning title=Не кандидат::Выкладывается «$REF» (${sha:0:12}) в обход кандидата — на тестовом этот коммит, может быть, не проверялся"
            origin="в обход кандидата: «$REF»"
          else
            sha=$(last_deployment staging)
            if [ -z "$sha" ]; then
              echo "::error::Нет кандидата в релиз: тестовый ещё ни разу не прошёл «CI» и проверку снаружи по новой схеме (Environments → staging). Дождитесь выкладки на тестовый или впишите ветку в поле «ref»."
              exit 1
            fi
            # Кандидат — коммит самой основной ветки (слияние PR), а не
            # коммит слитой в неё ветки: тестовый выкладывает только такие
            # (не через «| grep -q»: grep выходит на первом совпадении, git
            # получает SIGPIPE, и pipefail валит верную проверку)
            first_parent=$(git rev-list --first-parent "$main")
            if ! grep -qx "$sha" <<< "$first_parent"; then
              echo "::error::Кандидат ${sha:0:12} не из основной ветки — так быть не должно, релиз остановлен."
              exit 1
            fi
            origin="кандидат с тестового"
          fi

          # Прошлый релиз — последняя удачная запись production; до первой
          # такой записи — последний удачный запуск этого workflow
          prev=$(last_deployment production)
          if [ -z "$prev" ]; then
            prev=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/prod.yml/runs?status=success&per_page=20" \
              --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID)][0].head_sha // \"\"")
          fi

          # Слитые PR между двумя коммитами — по одному в строке
          merged() {
            git log --first-parent --format='%H' "$1..$2" | while read -r commit; do
              subject=$(git log -1 --format=%s "$commit")
              title=$(git log -1 --format=%b "$commit" | sed -n '1{/./p}')
              if [[ "$subject" =~ ^Merge\ pull\ request\ (#[0-9]+) ]]; then
                echo "- ${BASH_REMATCH[1]} ${title:-$subject}"
              else
                echo "- $subject"
              fi
            done
          }

          {
            echo "## Релиз ${sha:0:12}"
            echo
            echo "Что выкладывается: $origin — \`${sha:0:12}\` $(git log -1 --format=%s "$sha")"
            echo
            if [ -n "$prev" ] && git cat-file -e "$prev^{commit}" 2>/dev/null; then
              count=$(git rev-list --count --first-parent "$prev..$sha")
              if [ "$count" = 0 ]; then
                echo "С прошлого релиза (${prev:0:12}) нового нет — выкладка той же версии."
              else
                echo "С прошлого релиза (${prev:0:12}) — $count:"
                echo
                merged "$prev" "$sha"
              fi
            else
              echo "Прошлый релиз не найден."
            fi
            # Слитое позже кандидата: ещё идёт «CI» или тестовый — в
            # следующий релиз
            if [ -z "$REF" ] && [ "$sha" != "$main" ]; then
              echo
              echo "Ещё не на тестовом (войдёт в следующий релиз):"
              echo
              merged "$sha" "$main"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  deploy:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Запись удачного релиза — Environments → production
      deployments: write
    env:
      HOST: ${{ vars.PROD_HOST }}
      WEB_IP: ${{ vars.PROD_WEB_IP }}
      ADMIN_IP: ${{ vars.PROD_ADMIN_IP }}
      DB_IP: ${{ vars.PROD_DB_IP }}
      SITE_DOMAIN: ${{ vars.PROD_DOMAIN || 'new.savdex.uz' }}
      KNOWN_HOSTS: ${{ vars.PROD_KNOWN_HOSTS }}
      STAGING_HOST: ${{ vars.STAGING_HOST }}
      STAGING_HOST_KEY: ${{ vars.STAGING_HOST_KEY }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git

    steps:
      - uses: actions/checkout@v7
        with:
          # Коммит релиза — кандидат с тестового (или «ref»), его выбрал plan
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Проверка настроек
        env:
          RENDER_DATA: ${{ inputs.render_data }}
          CONFIRM: ${{ inputs.confirm }}
          LIVE: ${{ vars.PROD_LIVE }}
        run: |
          for name in WEB_IP ADMIN_IP DB_IP; do
            if [ -z "${!name}" ]; then
              echo "::error::Нет переменной PROD_$name — частного адреса машины (deploy/README.md)"
              exit 1
            fi
          done
          if [ "$RENDER_DATA" = true ]; then
            if [ "$LIVE" = true ]; then
              echo "::error::Сайт уже переехал (PROD_LIVE=true): копия с Render стёрла бы живые данные."
              exit 1
            fi
            if [ "$CONFIRM" != "да" ]; then
              echo "::error::Копия с Render стирает базу и файлы новых машин — напишите «да» в поле подтверждения."
              exit 1
            fi
          fi
          echo "Адрес сайта: $SITE_DOMAIN"

      - name: SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::Нет секрета DEPLOY_SSH_KEY (deploy/README.md)"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          # Ключ из Блокнота приходит с переносами Windows или одной
          # строкой — собираем заново (как в staging.yml)
          key=$(printf '%s' "$DEPLOY_SSH_KEY" | tr -d '\r')
          header=$(printf '%s' "$key" | grep -o -- '-----BEGIN [A-Z ]*-----' | head -1 || true)
          if [ -z "$header" ]; then
            echo "::error::В секрете DEPLOY_SSH_KEY не закрытый ключ."
            exit 1
          fi
          body=$(printf '%s' "$key" | sed -e 's/-----BEGIN [A-Z ]*-----//' -e 's/-----END [A-Z ]*-----//' | tr -d ' \t\n')
          umask 077
          { echo "$header"; printf '%s' "$body" | fold -w 70; echo; echo "${header/BEGIN/END}"; } > ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null

          cat > ~/.ssh/config <<CONF
          Host web
            HostName $HOST
            User deploy
          Host admin
            HostName $ADMIN_IP
            User deploy
            ProxyJump web
          Host db
            HostName $DB_IP
            User deploy
            ProxyJump web
          Host *
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            # Иначе ssh, узнав у машины новые ключи, перезаписывает
            # known_hosts целиком — и теряет строки, которые мы дописываем
            # в него в это же время
            UpdateHostKeys no
            ServerAliveInterval 30
          CONF

          # Ключи машин: из переменной PROD_KNOWN_HOSTS, иначе — с самих
          # машин (машина сайта — напрямую, остальные — через неё, по
          # частной сети) и подсказка, что сохранить
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -t ed25519 "$HOST" 2>/dev/null > ~/.ssh/known_hosts
            web_key=$(cut -d' ' -f2- ~/.ssh/known_hosts)
            # До подготовки машин пользователя deploy ещё нет — через root
            for ip in "$ADMIN_IP" "$DB_IP"; do
              found=$(ssh -o User=root "$HOST" "ssh-keyscan -t ed25519 $ip 2>/dev/null" \
                || ssh web "ssh-keyscan -t ed25519 $ip 2>/dev/null" || true)
              if [ -z "$found" ]; then
                echo "::error::Машина $ip не отвечает по SSH из частной сети — проверьте, что она запущена и в сети savdex-prod."
                exit 1
              fi
              printf '%s\n' "$found" >> ~/.ssh/known_hosts
            done
            printf '%s %s\n' "$WEB_IP" "$web_key" >> ~/.ssh/known_hosts
            {
              echo "Ключи машин не закреплены. Сохраните переменную PROD_KNOWN_HOSTS:"
              cat ~/.ssh/known_hosts
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Ключи машин не закреплены — значение для переменной PROD_KNOWN_HOSTS в сводке запуска (Summary)."
          fi
          # Ключ машины сайта по частному адресу — для машины админки
          # (prod-build.sh шлёт образ по частной сети)
          if ! grep -q "^$WEB_IP " ~/.ssh/known_hosts; then
            printf '%s %s\n' "$WEB_IP" "$(grep "^$HOST " ~/.ssh/known_hosts | cut -d' ' -f2-)" >> ~/.ssh/known_hosts
          fi
          # Тестовый — за образом; его ключ закреплён переменной, без неё
          # образ просто соберётся заново. Блок — только с адресом: пустой
          # HostName ssh считает ошибкой всего файла
          if [ -n "$STAGING_HOST" ] && [ -n "$STAGING_HOST_KEY" ]; then
            printf 'Host staging\n  HostName %s\n  User deploy\n  ConnectTimeout 20\n' "$STAGING_HOST" >> ~/.ssh/config
            printf '%s %s\n' "$STAGING_HOST" "$STAGING_HOST_KEY" >> ~/.ssh/known_hosts
          fi

      - name: Подготовить машины
        if: inputs.bootstrap
        run: |
          set -euo pipefail
          for role in web admin db; do
            case "$role" in
              web) target=(-o User=root "$HOST") ;;
              admin) target=(-o User=root -o ProxyJump="root@$HOST" "$ADMIN_IP") ;;
              db) target=(-o User=root -o ProxyJump="root@$HOST" "$DB_IP") ;;
            esac
            echo "── Машина $role"
            ssh "${target[@]}" 'cat > /tmp/savdex-bootstrap.sh' < deploy/server/bootstrap.sh
            ssh "${target[@]}" "SAVDEX_ROLE=$role WEB_IP=$WEB_IP ADMIN_IP=$ADMIN_IP bash /tmp/savdex-bootstrap.sh && rm -f /tmp/savdex-bootstrap.sh"
          done

      - name: Связь машины админки с машиной сайта
        run: |
          set -euo pipefail
          # Ключ машины админки на машине сайта может только загрузить
          # образ (docker load) и только с частного адреса админки
          pub=$(ssh admin 'cat ~/.ssh/ship_to_web.pub')
          line=$(printf 'restrict,from="%s",command="docker load" %s' "$ADMIN_IP" "$pub" | base64 -w0)
          ssh web "line=\$(echo $line | base64 -d)
            grep -qxF \"\$line\" ~/.ssh/authorized_keys || printf '%s\n' \"\$line\" >> ~/.ssh/authorized_keys"
          # Машина админки узнаёт машину сайта по её ключу, а не на веру
          entry=$(grep -m1 "^$WEB_IP " ~/.ssh/known_hosts)
          ssh admin "grep -qxF '$entry' ~/.ssh/known_hosts 2>/dev/null || echo '$entry' >> ~/.ssh/known_hosts"

      - name: Код на машинах
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "Коммит $sha"
          for host in admin web db; do
            ssh "$host" "set -e
              test -d /opt/savdex/src/.git || git clone --no-checkout --filter=blob:none '$REPO_URL' /opt/savdex/src
              git -C /opt/savdex/src fetch --depth 1 origin '$sha'
              git -C /opt/savdex/src checkout --force --detach FETCH_HEAD"
          done

      - name: База
        env:
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET || 'savdex' }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          # Сигналы копий в Healthchecks.io (docs/monitoring.md); нет — без них
          HC_PING_DB: ${{ secrets.HC_PING_DB }}
          HC_PING_FILES: ${{ secrets.HC_PING_FILES }}
        run: |
          set -euo pipefail
          # Ключи хранилища и пароль шифрования копий — на машину базы,
          # через stdin, не в командной строке
          if [ -n "$S3_ENDPOINT" ] && [ -n "$S3_ACCESS_KEY" ] && [ -n "$S3_SECRET_KEY" ] && [ -n "$BACKUP_PASSPHRASE" ]; then
            {
              printf 'S3_ENDPOINT=%q\n' "$S3_ENDPOINT"
              printf 'S3_BUCKET=%q\n' "$S3_BUCKET"
              printf 'S3_ACCESS_KEY=%q\n' "$S3_ACCESS_KEY"
              printf 'S3_SECRET_KEY=%q\n' "$S3_SECRET_KEY"
              printf 'BACKUP_PASSPHRASE=%q\n' "$BACKUP_PASSPHRASE"
              if [ -n "$HC_PING_DB" ]; then printf 'HC_PING_DB=%q\n' "$HC_PING_DB"; fi
              if [ -n "$HC_PING_FILES" ]; then printf 'HC_PING_FILES=%q\n' "$HC_PING_FILES"; fi
            } | ssh db 'umask 077; mkdir -p /opt/savdex/env; cat > /opt/savdex/env/backup.env'
          else
            echo "::warning::Нет ключей хранилища или BACKUP_PASSPHRASE — копии с машины базы не пойдут."
          fi
          ssh db 'bash /opt/savdex/src/deploy/server/prod-db.sh'
          # Адрес базы с паролями — сайту и админке
          for host in web admin; do
            ssh db 'cat /opt/savdex/env/app-db.env' \
              | ssh "$host" 'umask 077; mkdir -p /opt/savdex/env; cat > /opt/savdex/env/db.env'
          done

      - name: Настройки с Render
        if: inputs.render_env
        env:
          RENDER_SSH: ${{ vars.RENDER_SSH }}
          RENDER_HOST_KEY: ${{ vars.RENDER_SSH_HOST_KEY || 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFON8eay2FgHDBIVOLxWn/AWnsDJhCVvlY1igWEFoLD2' }}
        run: |
          set -euo pipefail
          if [ -z "$RENDER_SSH" ]; then
            echo "::error::Нет переменной RENDER_SSH (deploy/README.md)"
            exit 1
          fi
          printf '%s %s\n' "${RENDER_SSH#*@}" "$RENDER_HOST_KEY" >> ~/.ssh/known_hosts
          umask 077
          ssh -o UpdateHostKeys=no "$RENDER_SSH" 'env -0' \
            | python3 -I deploy/server/render-env.py > "$RUNNER_TEMP/app.env"
          for host in web admin; do
            ssh "$host" 'umask 077; cat > /opt/savdex/env/app.env' < "$RUNNER_TEMP/app.env"
          done
          rm -f "$RUNNER_TEMP/app.env"

      - name: Копия с Render
        if: inputs.render_data
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          RENDER_SSH: ${{ vars.RENDER_SSH }}
          RENDER_HOST_KEY: ${{ vars.RENDER_SSH_HOST_KEY || 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFON8eay2FgHDBIVOLxWn/AWnsDJhCVvlY1igWEFoLD2' }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL" ] || [ -z "$RENDER_SSH" ]; then
            echo "::error::Нужны секрет BACKUP_DATABASE_URL и переменная RENDER_SSH"
            exit 1
          fi
          grep -q "^${RENDER_SSH#*@} " ~/.ssh/known_hosts \
            || printf '%s %s\n' "${RENDER_SSH#*@}" "$RENDER_HOST_KEY" >> ~/.ssh/known_hosts
          umask 077

          echo "── Сайт и админка останавливаются"
          for host in web admin; do
            ssh "$host" 'docker ps -q --filter label=com.docker.compose.project=savdex \
              --filter label=com.docker.compose.service=app | xargs -r docker stop -t 40 > /dev/null'
          done

          echo "── База с Render"
          url="$DATABASE_URL"
          case "$url" in
            *sslmode=*) ;;
            *\?*) url="$url&sslmode=require" ;;
            *) url="$url?sslmode=require" ;;
          esac
          pg=$(grep -oE 'image: postgres:[0-9]+' deploy/prod/db/compose.yml | grep -oE '[0-9]+$')
          major=$(docker run --rm -e URL="$url" "postgres:$pg" sh -c 'psql -Atq "$URL" -c "show server_version_num"' | cut -c1-2)
          echo "Render: PostgreSQL $major, новая база: $pg"
          if [ "$major" != "$pg" ]; then
            echo "::error::Версии PostgreSQL расходятся — поднимите её в deploy/prod/db/compose.yml."
            exit 1
          fi
          docker run --rm -e URL="$url" -v "$RUNNER_TEMP:/out" "postgres:$pg" \
            sh -c 'pg_dump --format=custom --compress=9 --file=/out/prod.dump "$URL"'
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/prod.dump"
          echo "Копия базы: $(( $(stat -c %s "$RUNNER_TEMP/prod.dump") / 1024 )) КБ"
          ssh db 'install -d -m 700 /opt/savdex/restore; cat > /opt/savdex/restore/prod.dump' < "$RUNNER_TEMP/prod.dump"
          rm -f "$RUNNER_TEMP/prod.dump"
          ssh db 'SAVDEX_COMPOSE_FILE=/opt/savdex/src/deploy/prod/db/compose.yml SAVDEX_APP_SERVICE= \
            bash /opt/savdex/src/deploy/server/load-db.sh /opt/savdex/restore/prod.dump'

          echo "── Файлы с Render"
          ssh -o UpdateHostKeys=no -o ServerAliveInterval=30 "$RENDER_SSH" \
            'tar -C /var/data/storage -czf - public private' > "$RUNNER_TEMP/files.tgz"
          gzip -t "$RUNNER_TEMP/files.tgz"
          echo "Копия файлов: $(tar -tzf "$RUNNER_TEMP/files.tgz" | grep -vc '/$') файлов, $(( $(stat -c %s "$RUNNER_TEMP/files.tgz") / 1048576 )) МБ"
          ssh db 'cat > /opt/savdex/restore/files.tgz' < "$RUNNER_TEMP/files.tgz"
          rm -f "$RUNNER_TEMP/files.tgz"
          ssh db 'SAVDEX_DATA_DIR=/srv/savdex SAVDEX_TOOL_IMAGE=postgres:18 \
            bash /opt/savdex/src/deploy/server/load-files.sh /opt/savdex/restore/files.tgz'

      - name: Копия базы перед релизом
        if: ${{ !inputs.no_backup }}
        run: |
          set -euo pipefail
          # Дальше меняется схема базы (migrate): до неё — свежая копия в
          # хранилище, отдельным файлом с меткой release (docs/backups.md)
          if ! ssh db 'bash /opt/savdex/src/deploy/server/backup.sh db release'; then
            echo "::error title=Копия базы::Копия перед релизом не снялась — релиз остановлен, сайт и база не тронуты. Выложить без копии — галочка «без копии базы» (только если копия не снимается)."
            exit 1
          fi

      - name: Образ с тестового
        run: |
          set -euo pipefail
          tag=$(git rev-parse HEAD | cut -c1-12)
          # Тот же образ, что работал на тестовом, — а не собранный заново:
          # docker save там, docker load на машине админки, проверка по ID.
          # Нет его на тестовом — prod-build.sh соберёт образ на машине
          # админки, как раньше
          if ssh admin "docker image inspect savdex:$tag" > /dev/null 2>&1; then
            echo "::notice title=Образ::savdex:$tag уже есть на машине админки"
            exit 0
          fi
          if [ -z "$STAGING_HOST" ] || [ -z "$STAGING_HOST_KEY" ]; then
            echo "::warning title=Образ::Нет переменных STAGING_HOST и STAGING_HOST_KEY — образ соберётся на машине админки заново"
            exit 0
          fi
          if ! id=$(ssh staging "docker image inspect -f '{{.Id}}' savdex:$tag" 2>/dev/null); then
            echo "::warning title=Образ::На тестовом нет savdex:$tag — образ соберётся на машине админки заново"
            exit 0
          fi
          start=$(date +%s)
          if ! ssh staging "docker save savdex:$tag | gzip -1" | ssh admin 'gunzip | docker load' > /dev/null; then
            echo "::warning title=Образ::Не удалось перенести образ с тестового — соберётся на машине админки заново"
            exit 0
          fi
          got=$(ssh admin "docker image inspect -f '{{.Id}}' savdex:$tag")
          if [ "$got" != "$id" ]; then
            echo "::error title=Образ::На машине админки другой образ savdex:$tag ($got), чем на тестовом ($id)"
            exit 1
          fi
          echo "::notice title=Образ::savdex:$tag — тот же, что на тестовом (${id:7:12}), перенесён за $(( $(date +%s) - start )) с"

      - name: Сборка образа
        run: |
          set -euo pipefail
          # Образ уже перенесён с тестового — prod-build.sh не собирает, а
          # только отправляет его на машину сайта
          ssh admin "WEB_IP='$WEB_IP' bash /opt/savdex/src/deploy/server/prod-build.sh"

      - name: Админка и схема базы
        run: |
          set -euo pipefail
          tag=$(git rev-parse HEAD | cut -c1-12)
          ssh admin "SAVDEX_ROLE=admin DB_IP='$DB_IP' ADMIN_IP='$ADMIN_IP' SITE_DOMAIN='$SITE_DOMAIN' \
            bash /opt/savdex/src/deploy/server/prod-app.sh '$tag' --migrate"

      - name: Сайт
        env:
          STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          tag=$(git rev-parse HEAD | cut -c1-12)
          # Пока адрес не savdex.uz — репетиция: сайт под паролем тестового
          password=""
          if [ "$SITE_DOMAIN" != savdex.uz ]; then
            password="$STAGING_PASSWORD"
          fi
          printf '%s\n' "$password" \
            | ssh web "SAVDEX_ROLE=web DB_IP='$DB_IP' ADMIN_IP='$ADMIN_IP' SITE_DOMAIN='$SITE_DOMAIN' \
                bash /opt/savdex/src/deploy/server/prod-app.sh '$tag' --password-stdin"

      - name: Проверка снаружи
        env:
          STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          # Как посетитель: из интернета, по HTTPS. Сертификат Caddy
          # выпускает при первом обращении, а в день переезда — ещё и когда
          # DNS начнёт указывать сюда: ждём до пяти минут
          auth=()
          if [ "$SITE_DOMAIN" != savdex.uz ]; then
            auth=(-u "savdex:$STAGING_PASSWORD")
          fi
          code() { curl -s -o /dev/null -w '%{http_code}' "${auth[@]}" "https://$SITE_DOMAIN$1"; }
          for _ in $(seq 1 60); do
            [ "$(code /up)" = 200 ] && break
            sleep 5
          done
          for path in /up / /catalog /companies /login /register /py/admin/login/; do
            status=$(code "$path")
            echo "https://$SITE_DOMAIN$path — $status"
            if [ "$status" != 200 ]; then
              echo "::error::https://$SITE_DOMAIN$path отвечает $status"
              exit 1
            fi
          done
          # Админка — с машины админки: на её странице входа — форма Django
          curl -fsS "${auth[@]}" "https://$SITE_DOMAIN/py/admin/login/" | grep -q 'name="_token"'

      - name: Мониторинг
        # Агент Grafana Alloy на машинах (docs/monitoring.md, шаг 2): цифры
        # машин, контейнеров, базы и Caddy — в Grafana Cloud. Не настроен
        # (нет GRAFANA_PROM_URL) — шаг пропускается. Сбой здесь релиз не
        # валит: сайт уже выложен и проверен — предупреждение
        if: vars.GRAFANA_PROM_URL != ''
        env:
          GRAFANA_PROM_URL: ${{ vars.GRAFANA_PROM_URL }}
          GRAFANA_PROM_USER: ${{ vars.GRAFANA_PROM_USER }}
          GRAFANA_ALLOY_TOKEN: ${{ secrets.GRAFANA_ALLOY_TOKEN }}
        run: |
          set -uo pipefail
          installed=()
          for host in web admin db; do
            # Ключи — через stdin, не в командной строке
            if printf 'GRAFANA_PROM_URL=%s\nGRAFANA_PROM_USER=%s\nGRAFANA_ALLOY_TOKEN=%s\n' \
                "$GRAFANA_PROM_URL" "$GRAFANA_PROM_USER" "$GRAFANA_ALLOY_TOKEN" \
                | ssh "$host" "SAVDEX_MACHINE=$host bash /opt/savdex/src/deploy/server/monitoring.sh install"; then
              installed+=("$host")
            else
              echo "::warning title=Мониторинг ($host)::агент не поставился — журнал выше"
            fi
          done
          # Первые цифры агент отправляет через минуту после запуска
          [ ${#installed[@]} -gt 0 ] && sleep 75
          for host in "${installed[@]}"; do
            if out=$(ssh "$host" 'bash /opt/savdex/src/deploy/server/monitoring.sh check' 2>&1); then
              echo "$host: $out"
            else
              echo "$out"
              echo "::warning title=Мониторинг ($host)::$(printf '%s' "$out" | grep -m1 'ОШИБКА' || echo 'проверка не прошла')"
            fi
          done
          exit 0

      - name: Релиз записан
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          # Запись в GitHub → Environments → production: по ней следующий
          # релиз считает, что нового
          id=$(jq -n --arg ref "$sha" '{ref: $ref, environment: "production", auto_merge: false,
                 required_contexts: [], production_environment: true,
                 description: "Релиз на боевых машинах"}' \
               | gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)
          gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" \
            -f state=success -f environment_url="https://$SITE_DOMAIN" \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          echo "Готово: https://$SITE_DOMAIN — \`${sha:0:12}\`" >> "$GITHUB_STEP_SUMMARY"
