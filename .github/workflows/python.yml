# Проверки Python-половины площадки — часть общей проверки CI
# (.github/workflows/ci.yml), сам по себе не запускается.
#
# Заведён вместе с каркасом Django (этап 0 переноса,
# docs/migration-to-python.md).
#
# Большинство проверок базы не требуют: предохранители разбирают текст
# запроса, а остальное идёт на SQLite в памяти. PostgreSQL нужен там,
# где проверяется то, чего у SQLite нет, — версия сервера, права ролей,
# has_table_privilege. Без него такие проверки пропускаются, поэтому
# здесь поднимается служебный контейнер: пропущенная проверка — не
# проверка.
#
# PHP не нужен (с переводом тестов на Python): схему проверочной базы
# строит снимок savdex/bootstrap, данные — фабрики tests/factories.py.
#
# Тесты идут в четыре потока, у каждого своя машина и своя база: файлы
# раскладывает .github/scripts/shards.py, каждый — ровно в один поток.
# Одним потоком было 30–45 минут.
name: python

on:
  workflow_call:

defaults:
  run:
    working-directory: python

jobs:
  # Порядок нарочный: разбор кода быстрее проверки типов. Тесты идут
  # параллельно, не дожидаясь: ждать их всё равно дольше всего
  lint:
    name: разбор и типы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --all-groups

      - name: Разбор кода
        run: uv run ruff check .

      - name: Оформление
        run: uv run ruff format --check .

      - name: Типы
        run: uv run mypy savdex

  tests:
    name: тесты ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      # Упавший поток не останавливает остальные: видно все ошибки сразу
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        # Та же основная версия, что на Render
        image: postgres:16
        env:
          POSTGRES_USER: savdex
          POSTGRES_PASSWORD: savdex
          # «test» в имени обязателен: проверки стирают схему
          # целиком и в базу с другим именем не пойдут
          POSTGRES_DB: savdex_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --all-groups

      - name: Тесты
        # Упавшие тесты — ещё и аннотациями: видны на странице запуска без журнала
        run: |
          set -o pipefail
          files=$(python3 ../.github/scripts/shards.py "${{ matrix.shard }}" 4)
          echo "Файлов в потоке: $(wc -w <<< "$files")"
          # shellcheck disable=SC2086
          uv run pytest -q -rfE $files 2>&1 | tee /tmp/pytest.txt || {
            status=$?
            grep -E '^(FAILED|ERROR) ' /tmp/pytest.txt | head -30 | sed 's/^/::error title=Тест::/'
            exit $status
          }
        env:
          SAVDEX_TEST_PG_URL: postgres://savdex:savdex@127.0.0.1:5432/savdex_test
          SAVDEX_PARITY_PG_URL: postgres://savdex:savdex@127.0.0.1:5432/savdex_test
