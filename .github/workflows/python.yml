defaults:
  run:
    working-directory: python

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Та же основная версия, что на Render
        image: postgres:16
        env:
          POSTGRES_USER: savdex
          POSTGRES_PASSWORD: savdex
          # «test» в имени обязателен: проверки стирают схему
          # целиком и в базу с другим именем не пойдут
          POSTGRES_DB: savdex_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-groups

      # PHP для сравнения выгрузок: миграции, наполнение, PHP-выгрузка
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, gd, intl, bcmath
          coverage: none

      - name: Кэш composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Зависимости Laravel
        working-directory: .
        run: composer install --no-interaction --no-progress --prefer-dist

      # Порядок нарочный: разбор кода быстрее проверки типов, а та
      # быстрее тестов. Ошибка находится раньше и дешевле
      - name: Разбор кода
        run: uv run ruff check .

      - name: Оформление
        run: uv run ruff format --check .

      - name: Типы
        run: uv run mypy savdex

      - name: Тесты
        run: uv run pytest -q
        env:
          SAVDEX_TEST_PG_URL: postgres://savdex:savdex@127.0.0.1:5432/savdex_test
          SAVDEX_PARITY_PG_URL: postgres://savdex:savdex@127.0.0.1:5432/savdex_test
