# Проверки Python-половины площадки.
#
# Заведён вместе с каркасом Django (этап 0 переноса,
# docs/migration-to-python.md).
#
# Большинство проверок базы не требуют: предохранители разбирают текст
# запроса, а остальное идёт на SQLite в памяти. PostgreSQL нужен там,
# где проверяется то, чего у SQLite нет, — версия сервера, права ролей,
# has_table_privilege. Без него такие проверки пропускаются, поэтому
# здесь поднимается служебный контейнер: пропущенная проверка — не
# проверка.
#
# PHP здесь тоже нужен — для сравнения выгрузок (test_export_parity.py):
# схему строят миграции Laravel, данные — скрипт наполнения, и книги
# PHP- и Python-версий сверяются ячейка в ячейку. Собственная сверка
# выгрузки ошибку чтения не видит, а это сравнение — видит.
#
# То же для выдачи прав администратора (test_admin_parity.py): обе
# команды на одной базе, и Laravel сам проверяет пароль, выданный Python.
#
# Поэтому проверка запускается и при правке PHP-половины этих команд или
# миграций: иначе правка в одной половине тихо развела бы две версии.
