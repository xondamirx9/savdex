# Тестовый сервер staging.savdex.uz в Uztelecom Cloud (deploy/README.md).
#
# Каждый коммит основной ветки выкладывается сюда сам — но только после
# зелёной проверки «CI» на нём (.github/workflows/ci.yml): красный код на
# тестовый не попадает. После выкладки — проверка снаружи: главные
# страницы, вход и регистрация, форма входа в админку. Прошла — коммит
# становится кандидатом в релиз: запись в GitHub → Environments → staging
# (Deployments API); на боевые машины выкладывается кандидат.
#
# Проверки двух слияний подряд могут закончиться не по порядку: коммит,
# который старше уже выложенного, тестовый не заменяет.
#
# Вручную (Actions → staging → Run workflow) можно выложить любую ветку,
# чтобы проверить её до слияния — кандидатом такая выкладка не считается,
# а следующее слияние её заменит; один раз — подготовить чистую машину
# (галочка «bootstrap»).
#
# Данные тестового — свои, на диске самой машины, не боевые: галочка
# «сбросить на демо-данные» (и «да» в подтверждении) стирает базу и
# файлы тестового и заводит придуманные компании, объявления и отзывы
# (deploy/server/staging-reset.sh, manage.py demo). Галочка «ключи почты
# и SMS» один раз переносит с боевой машины настройки MAIL_* и TELNYX_*:
# письма и SMS с тестового уходят по-настоящему — поэтому только после
# сброса на демо-данные.
#
# Образ собирается на самой машине (deploy/server/deploy.sh): так с
# GitHub уходит только код, а не образ в сотни мегабайт.
#
# Пока сервер не заведён (нет переменной STAGING_HOST), workflow
# пропускается и не краснеет.
#
# Секреты и переменные (Settings → Secrets and variables → Actions):
#   secrets.DEPLOY_SSH_KEY     закрытый SSH-ключ, открытая часть — в машине
#                              (тот же, что у боевых машин)
#   secrets.STAGING_PASSWORD   пароль на тестовый сайт (логин savdex)
#   vars.STAGING_HOST          публичный IP машины
#   vars.STAGING_HOST_KEY      ключ машины («ssh-ed25519 AAAA…») — защищает
#                              от подмены сервера; первая выкладка подскажет его
#   vars.STAGING_DOMAIN        адрес сайта, по умолчанию staging.savdex.uz
#   vars.STAGING_BOOTSTRAP_USER  пользователь образа ОС для подготовки
#                              машины (root или ubuntu), по умолчанию root
#   vars.PROD_HOST, PROD_KNOWN_HOSTS  боевая машина сайта — для галочки
#                              «ключи почты и SMS» (как в prod.yml)
#
# Репозиторий публичный, журналы Actions видят все: пароли и ключи
# в журнал не выводятся — пароль уходит на сервер через stdin.
name: staging

on:
  # Когда закончилась проверка «CI» на основной ветке; зелёная ли — решает
  # условие задачи ниже
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [claude/website-copy-new-design-xaxsr0]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ветка или коммит (пусто — основная ветка)'
        required: false
        default: ''
      bootstrap:
        description: 'Сначала подготовить чистую машину (один раз)'
        type: boolean
        default: false
      demo_reset:
        description: 'Сбросить на демо-данные (база и файлы тестового стираются)'
        type: boolean
        default: false
      confirm:
        description: 'Для сброса — напишите «да»'
        required: false
        default: ''
      prod_keys:
        description: 'Перенести с боевой ключи почты и SMS (MAIL_*, TELNYX_*)'
        type: boolean
        default: false

concurrency:
  group: staging
  cancel-in-progress: false

permissions:
  contents: read
  # Отметка «кандидат в релиз» — запись выкладки в GitHub
  deployments: write

jobs:
  deploy:
    # Вручную — всегда. После «CI» — только если она зелёная и проверяла
    # push в основную ветку, а не ручной запуск
    if: >-
      vars.STAGING_HOST != '' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HOST: ${{ vars.STAGING_HOST }}
      HOST_KEY: ${{ vars.STAGING_HOST_KEY }}
      SITE_DOMAIN: ${{ vars.STAGING_DOMAIN || 'staging.savdex.uz' }}
      BOOTSTRAP_USER: ${{ vars.STAGING_BOOTSTRAP_USER || 'root' }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
      # Тот коммит, который проверила «CI»; вручную — ветка из поля или
      # основная ветка
      SHA: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          # Вся история: «не новее ли уже на тестовом» сравнивает коммиты
          fetch-depth: 0
          persist-credentials: false

      - name: SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::Нет секрета DEPLOY_SSH_KEY (deploy/README.md)"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          # Ключ, вставленный в секрет из Блокнота, приходит с переносами
          # Windows (\r) или вовсе одной строкой — OpenSSH такой не читает
          # («error in libcrypto»). Собираем заново: заголовок, тело base64
          # по 70 знаков, конец
          key=$(printf '%s' "$DEPLOY_SSH_KEY" | tr -d '\r')
          header=$(printf '%s' "$key" | grep -o -- '-----BEGIN [A-Z ]*-----' | head -1 || true)
          if [ -z "$header" ]; then
            echo "::error::В секрете DEPLOY_SSH_KEY не закрытый ключ: нет строки «-----BEGIN … PRIVATE KEY-----». Вставьте файл savdex-deploy (без .pub) целиком."
            exit 1
          fi
          body=$(printf '%s' "$key" | sed -e 's/-----BEGIN [A-Z ]*-----//' -e 's/-----END [A-Z ]*-----//' | tr -d ' \t\n')
          umask 077
          { echo "$header"; printf '%s' "$body" | fold -w 70; echo; echo "${header/BEGIN/END}"; } > ~/.ssh/id_deploy
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null; then
            echo "::error::Ключ в секрете DEPLOY_SSH_KEY не читается — похоже, скопирован не целиком. Вставьте файл savdex-deploy (без .pub) заново, от «-----BEGIN» до «-----END … KEY-----» включительно."
            exit 1
          fi
          if [ -n "$HOST_KEY" ]; then
            printf '%s %s\n' "$HOST" "$HOST_KEY" > ~/.ssh/known_hosts
          else
            ssh-keyscan -t ed25519 "$HOST" > ~/.ssh/known_hosts 2>/dev/null
            echo "::warning::Ключ сервера не закреплён. Добавьте переменную STAGING_HOST_KEY = $(cut -d' ' -f2- ~/.ssh/known_hosts)"
          fi
          cat > ~/.ssh/config <<CONF
          Host staging
            HostName $HOST
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          CONF

      - name: Подготовить машину
        if: inputs.bootstrap
        run: |
          scp -o User="$BOOTSTRAP_USER" deploy/server/bootstrap.sh staging:/tmp/savdex-bootstrap.sh
          if [ "$BOOTSTRAP_USER" = root ]; then
            ssh -l root staging 'bash /tmp/savdex-bootstrap.sh && rm -f /tmp/savdex-bootstrap.sh'
          else
            ssh -l "$BOOTSTRAP_USER" staging 'sudo -n bash /tmp/savdex-bootstrap.sh && rm -f /tmp/savdex-bootstrap.sh'
          fi

      - name: Не новее ли уже на тестовом
        id: fresh
        if: github.event_name == 'workflow_run'
        run: |
          # Проверки двух слияний подряд могут закончиться не по порядку:
          # коммит, который старше уже выложенного, тестовый не заменяет
          sha=$(git rev-parse HEAD)
          current=$(ssh -l deploy staging 'cat /opt/savdex/current-tag 2>/dev/null' || true)
          if [ -n "$current" ] && [ "${sha:0:12}" != "$current" ] \
            && git merge-base --is-ancestor "$sha" "$current" 2>/dev/null; then
            echo "::notice title=Пропуск::На тестовом уже $current — он новее ${sha:0:12}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Код на сервере
        if: steps.fresh.outputs.skip != 'true'
        run: |
          sha=$(git rev-parse HEAD)
          # Аннотацией: видна на странице запуска без журнала
          echo "::notice title=Коммит::$(git log -1 --format='%h %s')"
          ssh -l deploy staging "set -e
            test -d /opt/savdex/src/.git || git clone --no-checkout --filter=blob:none '$REPO_URL' /opt/savdex/src
            git -C /opt/savdex/src fetch --depth 1 origin '$sha'
            git -C /opt/savdex/src checkout --force --detach FETCH_HEAD"

      - name: Сборка и запуск
        if: steps.fresh.outputs.skip != 'true'
        env:
          STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
        run: |
          printf '%s\n' "$STAGING_PASSWORD" \
            | ssh -l deploy staging "SITE_DOMAIN='$SITE_DOMAIN' bash /opt/savdex/src/deploy/server/deploy.sh --password-stdin"
          # Что на самом деле запущено: тег образа и коммит последней выкладки
          echo "::notice title=Запущено::$(ssh -l deploy staging 'tail -1 /opt/savdex/releases.log')"

      - name: Демо-данные
        if: inputs.demo_reset
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "да" ]; then
            echo "::error::Сброс стирает базу и файлы тестового — напишите «да» в поле подтверждения."
            exit 1
          fi
          ssh -l deploy staging 'bash /opt/savdex/src/deploy/server/staging-reset.sh'

      - name: Ключи почты и SMS с боевого
        if: inputs.prod_keys
        env:
          PROD_HOST: ${{ vars.PROD_HOST }}
          PROD_KNOWN_HOSTS: ${{ vars.PROD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          # Письма и SMS отсюда пойдут по-настоящему: только когда на
          # тестовом демо-данные, а не копия боевой базы с людьми
          if ! ssh -l deploy staging 'test -f /opt/savdex/demo-data'; then
            echo "::error::На тестовом нет отметки о демо-данных — сначала сброс (галочка «сбросить на демо-данные» и «да»)."
            exit 1
          fi
          if [ -z "$PROD_HOST" ]; then
            echo "::error::Нет переменной PROD_HOST"
            exit 1
          fi
          if [ -n "$PROD_KNOWN_HOSTS" ]; then
            printf '%s\n' "$PROD_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -t ed25519 "$PROD_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          prod() {
            ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UpdateHostKeys=no "deploy@$PROD_HOST" "$@"
          }
          if ! prod true; then
            echo "::error::Нет доступа к боевой машине $PROD_HOST по SSH (ключ DEPLOY_SSH_KEY, PROD_KNOWN_HOSTS)."
            exit 1
          fi
          # Значения — только в файле раннера и на тестовом, в журнал не
          # выводятся; «От кого» у тестового — свой, с пометкой
          umask 077
          prod "grep -E '^(MAIL|TELNYX)_[A-Z_]+=' /opt/savdex/env/app.env || true" \
            | grep -v -E '^MAIL_(FROM_NAME|LOG_PATH)=' > "$RUNNER_TEMP/keys.env" || true
          if ! grep -q '^TELNYX_API_KEY=' "$RUNNER_TEMP/keys.env" || ! grep -q '^MAIL_PASSWORD=' "$RUNNER_TEMP/keys.env"; then
            rm -f "$RUNNER_TEMP/keys.env"
            echo "::error::На боевой машине нет MAIL_PASSWORD или TELNYX_API_KEY в настройках."
            exit 1
          fi
          echo "MAIL_FROM_NAME='SAVDEX (тест)'" >> "$RUNNER_TEMP/keys.env"
          ssh -l deploy staging 'bash /opt/savdex/src/deploy/server/env-merge.sh' < "$RUNNER_TEMP/keys.env"
          rm -f "$RUNNER_TEMP/keys.env"
          ssh -l deploy staging 'bash /opt/savdex/src/deploy/server/staging-restart.sh'

      - name: Проверка снаружи
        if: steps.fresh.outputs.skip != 'true'
        env:
          STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          # Как посетитель: из интернета, по HTTPS, с паролем тестового
          auth=(-u "savdex:$STAGING_PASSWORD")
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${auth[@]}" "https://$SITE_DOMAIN$1" || true; }
          for _ in $(seq 1 30); do
            [ "$(code /up)" = 200 ] && break
            sleep 5
          done
          failed=0
          for path in /up / /catalog /companies /login /register /py/admin/login/; do
            status=$(code "$path")
            echo "https://$SITE_DOMAIN$path — $status"
            if [ "$status" != 200 ]; then
              echo "::error title=Проверка снаружи::$path отвечает $status"
              failed=1
            fi
          done
          # Вход в админку — настоящая форма Django, а не заглушка
          if ! curl -fsS --max-time 30 "${auth[@]}" "https://$SITE_DOMAIN/py/admin/login/" | grep -q 'name="_token"'; then
            echo "::error title=Проверка снаружи::на /py/admin/login/ нет формы входа"
            failed=1
          fi
          exit "$failed"

      - name: Кандидат в релиз
        if: steps.fresh.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          # Вручную выложенная ветка или коммит без проверки «CI» — не кандидат
          if [ "$GITHUB_EVENT_NAME" != workflow_run ]; then
            echo "Выложено вручную (\`${sha:0:12}\`) — не кандидат в релиз: кандидат — только коммит основной ветки после зелёной «CI»." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Запись выкладки в GitHub: Environments → staging показывает
          # кандидата, выкладка на боевые машины берёт последнего удачного
          id=$(jq -n --arg ref "$sha" '{ref: $ref, environment: "staging", auto_merge: false,
                 required_contexts: [], description: "CI и проверка снаружи пройдены"}' \
               | gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)
          gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" \
            -f state=success -f environment_url="https://$SITE_DOMAIN" \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          echo "::notice title=Кандидат в релиз::${sha:0:12} $(git log -1 --format=%s)"
          echo "Кандидат в релиз: \`${sha:0:12}\` — $(git log -1 --format=%s)" >> "$GITHUB_STEP_SUMMARY"
