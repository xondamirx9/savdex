# Тревоги Grafana Cloud → Telegram-группа (docs/monitoring.md, шаг 3):
# правила из deploy/monitoring/alerts.yaml — в Grafana, скриптом
# deploy/monitoring/grafana-alerts.py.
#
# - PR, где менялись тревоги, — только проверка файла правил (задача
#   rules), без ключей: код из PR секретов не получает;
# - слияние таких изменений в основную ветку и Actions → alerts → Run
#   workflow на основной ветке — проверка ключей (Grafana принимает ключ,
#   бот видит группу), загрузка в Grafana и сообщение в группу «тревоги
#   обновлены» (задача alerts, окружение production).
#
# Нужны (Settings → Environments → production):
#   vars.GRAFANA_URL            адрес стека, https://….grafana.net
#   secrets.GRAFANA_SA_TOKEN    ключ сервисного аккаунта Grafana (роль Admin)
#   secrets.TELEGRAM_BOT_TOKEN  токен бота от @BotFather
#   secrets.TELEGRAM_CHAT_ID    номер группы, с минусом
# Значения в журнал не выводятся.
name: alerts

on:
  pull_request:
    paths:
      - deploy/monitoring/alerts.yaml
      - deploy/monitoring/grafana-alerts.py
      - .github/workflows/alerts.yml
  push:
    branches: [claude/website-copy-new-design-xaxsr0]
    paths:
      - deploy/monitoring/alerts.yaml
      - deploy/monitoring/grafana-alerts.py
      - .github/workflows/alerts.yml
  workflow_dispatch:

permissions:
  contents: read

# Загрузки — по очереди, проверки PR — каждая своя
concurrency:
  group: alerts-${{ github.event_name == 'pull_request' && github.ref || 'apply' }}
  cancel-in-progress: false

jobs:
  # Файл правил разбирается — без ключей, и для PR тоже
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7

      - name: Файл правил
        run: uv run --no-project --with pyyaml==6.0.2 python -I deploy/monitoring/grafana-alerts.py rules

  # Ключи и загрузка — только основная ветка, в окружении production:
  # секреты лежат там, ветка или PR их не получает
  alerts:
    needs: rules
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/claude/website-copy-new-design-xaxsr0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      # Только секреты окружения, без записи «выкладка» (её делает prod.yml)
      deployment: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7

      - name: Проверка ключей и загрузка в Grafana
        env:
          GRAFANA_URL: ${{ vars.GRAFANA_URL }}
          GRAFANA_SA_TOKEN: ${{ secrets.GRAFANA_SA_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run --no-project --with pyyaml==6.0.2 python -I deploy/monitoring/grafana-alerts.py apply
