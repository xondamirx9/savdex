# Проверки PHP-половины площадки.
#
# До сентября 2026 в репозитории не было CI вообще: 1286 тестов
# гонялись вручную, и сломанная ветка выяснялась уже после слияния.
# Заведён вместе с проверками Python (docs/migration-to-python.md),
# чтобы обе половины проверялись одинаково, пока живут рядом.
#
# Базы поднимать не нужно: тесты идут на SQLite в памяти
# (см. phpunit.xml).
#
# Два шага ниже делают то, что у разработчика уже есть и потому
# незаметно: .env с ключом шифрования и собранный фронтенд. Первая
# версия этого файла их не имела и упала бы на первом же тесте
# страницы — «Vite manifest not found». Найдено до первого прогона,
# воспроизведением условий CI локально.
name: php

on:
  push:
    paths-ignore: ['python/**', 'docs/**', '.github/workflows/python.yml']
  pull_request:
    paths-ignore: ['python/**', 'docs/**', '.github/workflows/python.yml']

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # sqlite3 и pdo_sqlite — для тестов, gd — для ImageStore
          # (пересборка картинок), intl — для дат и падежей
          extensions: mbstring, sqlite3, pdo_sqlite, gd, intl, bcmath
          coverage: none

      - name: Кэш composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --no-progress --prefer-dist

      # Ключ шифрования: без него любой тест, проходящий через куки
      # или сессию, падает MissingAppKeyException. Ключ одноразовый,
      # живёт только в этом прогоне
      - name: Окружение
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Тесты страниц рендерят app.blade.php, а в нём @vite — без
      # собранного манифеста падает каждая страница. Заодно это
      # проверка, что фронтенд вообще собирается
      - name: Сборка фронтенда
        run: |
          npm ci --ignore-scripts
          npm run build

      # Порядок нарочный: оформление проверяется за секунды, тесты —
      # за две минуты. Ошибка находится раньше и дешевле
      - name: Оформление
        run: vendor/bin/pint --test

      - name: Тесты
        run: php artisan test
        env:
          APP_ENV: testing
