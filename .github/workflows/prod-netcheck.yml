# Временная проверка связи между боевыми машинами Uztelecom (удалится)
name: prod-netcheck

on:
  push:
    branches: [claude/ecstatic-hamilton-324y24]
    paths: ['.github/workflows/prod-netcheck.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: ${{ vars.PROD_HOST }}
      WEB_IP: ${{ vars.PROD_WEB_IP }}
      ADMIN_IP: ${{ vars.PROD_ADMIN_IP }}
      DB_IP: ${{ vars.PROD_DB_IP }}
      KNOWN_HOSTS: ''
    steps:
      - name: SSH (как в prod.yml)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::Нет секрета DEPLOY_SSH_KEY (deploy/README.md)"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          # Ключ из Блокнота приходит с переносами Windows или одной
          # строкой — собираем заново (как в staging.yml)
          key=$(printf '%s' "$DEPLOY_SSH_KEY" | tr -d '\r')
          header=$(printf '%s' "$key" | grep -o -- '-----BEGIN [A-Z ]*-----' | head -1 || true)
          if [ -z "$header" ]; then
            echo "::error::В секрете DEPLOY_SSH_KEY не закрытый ключ."
            exit 1
          fi
          body=$(printf '%s' "$key" | sed -e 's/-----BEGIN [A-Z ]*-----//' -e 's/-----END [A-Z ]*-----//' | tr -d ' \t\n')
          umask 077
          { echo "$header"; printf '%s' "$body" | fold -w 70; echo; echo "${header/BEGIN/END}"; } > ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null

          cat > ~/.ssh/config <<CONF
          Host web
            HostName $HOST
            User deploy
          Host admin
            HostName $ADMIN_IP
            User deploy
            ProxyJump web
          Host db
            HostName $DB_IP
            User deploy
            ProxyJump web
          Host *
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          CONF

          # Ключи машин: из переменной PROD_KNOWN_HOSTS, иначе — с самих
          # машин (машина сайта — напрямую, остальные — через неё, по
          # частной сети) и подсказка, что сохранить
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -t ed25519 "$HOST" 2>/dev/null > ~/.ssh/known_hosts
            web_key=$(cut -d' ' -f2- ~/.ssh/known_hosts)
            # До подготовки машин пользователя deploy ещё нет — через root
            for ip in "$ADMIN_IP" "$DB_IP"; do
              ssh -o User=root "$HOST" "ssh-keyscan -t ed25519 $ip 2>/dev/null" >> ~/.ssh/known_hosts \
                || ssh web "ssh-keyscan -t ed25519 $ip 2>/dev/null" >> ~/.ssh/known_hosts
            done
            printf '%s %s\n' "$WEB_IP" "$web_key" >> ~/.ssh/known_hosts
            {
              echo "Ключи машин не закреплены. Сохраните переменную PROD_KNOWN_HOSTS:"
              cat ~/.ssh/known_hosts
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Ключи машин не закреплены — значение для переменной PROD_KNOWN_HOSTS в сводке запуска (Summary)."
          fi
          # Ключ машины сайта по частному адресу — для машины админки
          # (prod-build.sh шлёт образ по частной сети)
          if ! grep -q "^$WEB_IP " ~/.ssh/known_hosts; then
            printf '%s %s\n' "$WEB_IP" "$(grep "^$HOST " ~/.ssh/known_hosts | cut -d' ' -f2-)" >> ~/.ssh/known_hosts
          fi

      - name: Что собрано
        run: |
          echo "── known_hosts:"; cat ~/.ssh/known_hosts
          echo "── проверка входа на admin через web (root):"
          ssh -o User=root -o ProxyJump="root@$HOST" "$ADMIN_IP" 'hostname' || echo "не вышло"
