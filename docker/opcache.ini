; Кэш скомпилированного PHP.
;
; Образ неизменен: код внутри контейнера не правится, новый деплой —
; это новый образ и новые процессы. Поэтому проверять даты файлов
; не нужно — validate_timestamps=0 убирает системный вызов stat()
; на каждый из полутора тысяч файлов каждого запроса.
;
; Остальные числа — с запасом от измеренного: приложение поднимает
; ~1500 файлов и ~10 МБ исходников на процесс, в проекте их 23 648.
; Запас нужен на рост: переполненный кэш не вытесняет старое,
; а просто перестаёт кэшировать новое, и заметить это нечем.
opcache.enable=1
opcache.validate_timestamps=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=32531
