# Сайт: один виртуальный хост на любом порту — слушает Apache тот, что
# в $PORT (его задаёт Render, docker/render-entrypoint.sh пишет Listen).
# Правила — общие, docker/apache-python.conf: файлы из public/,
# остальное — Django.
<VirtualHost *:*>
    DocumentRoot /var/www/html/public

    # FollowSymLinks — загрузки: public/storage ведёт на storage/app/public,
    # а та — на постоянный диск. Без Indexes: списка файлов папки
    # посетитель не видит
    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Перезапись в самом хосте включена — иначе общие правила
    # (RewriteOptions InheritDown) он не наследует
    RewriteEngine On

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
