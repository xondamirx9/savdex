# Распределитель адресов: какие пути сайта обслуживает Django.
#
# Перенос с Laravel на Django идёт по частям (docs/migration-to-python.md),
# и обе половины живут в одной службе Render. Посетитель приходит
# в Apache; путь из списка ниже Apache передаёт Django (gunicorn на
# 127.0.0.1:8001, его запускает docker/render-entrypoint.sh), всё
# остальное, как и раньше, — Laravel через public/.htaccess.
#
# ProxyPass срабатывает раньше .htaccess: путь из списка до правил
# Laravel не доходит. Порядок строк важен — Apache берёт первое
# совпадение, поэтому более длинные пути ставятся выше коротких.
#
# Добавление строки — и есть «отдать адрес Django». Убрать строку и
# передеплоить — откат: адрес снова обслуживает Laravel.
#
# retry=0: если Django перезапускается, Apache не выжидает минуту
# перед следующей попыткой, а пробует на следующем же запросе.
# timeout — как Timeout у Apache (130 с, render-entrypoint.sh).

ProxyRequests Off
ProxyPreserveHost On

# Служебная проверка: Django жив и доступен через Apache
ProxyPass        /py/ http://127.0.0.1:8001/py/ retry=0 timeout=130
ProxyPassReverse /py/ http://127.0.0.1:8001/py/

# ── Страницы сайта на Django (этапы 3–4) ───────────────────────────────
#
# Страницы переезжают группами, и каждая группа включается переменной
# SAVDEX_PY_PAGES (через запятую; ставит docker/render-entrypoint.sh).
# Убрать группу из переменной в настройках Render и перезапустить —
# откат без выкладки: адреса снова отдаёт Laravel.
#
# Django отдаёт страницу, только если:
# - хост — основной домен сайта (SAVDEX_HOST, из APP_URL): служебный
#   адрес Render уводит на домен Laravel (CanonicalHost); из домена
#   мини-сайтов (MICROSITE_DOMAIN) Django отдаёт только «/» (сам сайт,
#   группа companies), прочее там — Laravel (RestrictSiteHost);
# - запрос читающий (GET, HEAD) — формы идут своей группой (forms);
# - в адресе нет ?hl=<язык> — смену языка (SetLocale: выбор в сессию и в
#   профиль, редирект на чистый адрес) пока делает Laravel. Неизвестный
#   язык (?hl=, ?hl=de) Laravel пропускает мимо и отдаёт страницу — такую
#   отдаёт Django: иначе контроллер Laravel писал бы счётчики просмотров
#   в таблицы, хозяин которых с этапа 4 — Django.
#
# Правила перезаписи виртуальные хосты сами не наследуют — InheritDown
# передаёт их вниз, в сайт из sites-enabled.
RewriteEngine On
RewriteOptions InheritDown

# /index.php/<адрес> Laravel принимает как <адрес> — мимо всех правил
# ниже, любым методом. Такие ссылки площадка не строит; уводим на
# чистый адрес, а он уже идёт по правилам (этап 4, шаг 62)
RewriteRule ^/index\.php(/.+)$ $1 [R=301,L,NE]

# admin: вход в админку и её главная — Django (шаг 67, python/savdex/
# adminlogin.py). Вход пишет ту же сессию Laravel, что вход Filament,
# поэтому оставшиеся страницы Filament («Выгрузка в Excel») и пропуск
# /admin/python работают как раньше. Откат — убрать admin из
# SAVDEX_PY_PAGES: вернётся вход и главная Filament
RewriteCond expr "osenv('SAVDEX_PY_PAGES') =~ /(^|,) *admin *(,|$)/"
RewriteCond expr "%{HTTP_HOST} == osenv('SAVDEX_HOST')"
RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
RewriteRule ^/admin/login/?$ /py/admin/login/ [R=302,L]
RewriteCond expr "osenv('SAVDEX_PY_PAGES') =~ /(^|,) *admin *(,|$)/"
RewriteCond expr "%{HTTP_HOST} == osenv('SAVDEX_HOST')"
RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
RewriteRule ^/admin/?$ /py/admin/ [R=302,L]

# docs: «Помощь», «Инструкция», «Правила» (python/savdex/web/views.py)
RewriteCond expr "osenv('SAVDEX_PY_PAGES') =~ /(^|,) *docs *(,|$)/"
RewriteCond expr "%{HTTP_HOST} == osenv('SAVDEX_HOST')"
RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
RewriteCond %{QUERY_STRING} !(^|&)hl=(ru|uz|en|zh|tr)(&|$)
RewriteRule ^/(?:(?:uz|en|zh|tr)/)?(?:help|guide|rules)$ http://127.0.0.1:8001%{REQUEST_URI} [P,L]

# news: лента и новость (python/savdex/web/news.py)
RewriteCond expr "osenv('SAVDEX_PY_PAGES') =~ /(^|,) *news *(,|$)/"
RewriteCond expr "%{HTTP_HOST} == osenv('SAVDEX_HOST')"
RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
RewriteCond %{QUERY_STRING} !(^|&)hl=(ru|uz|en|zh|tr)(&|$)
RewriteRule ^/(?:(?:uz|en|zh|tr)/)?news(?:/[^/]+)?$ http://127.0.0.1:8001%{REQUEST_URI} [P,L]

# about: «О компании» и «Контакты» (python/savdex/web/views.py)
RewriteCond expr "osenv('SAVDEX_PY_PAGES') =~ /(^|,) *about *(,|$)/"
RewriteCond expr "%{HTTP_HOST} == osenv('SAVDEX_HOST')"
RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
RewriteCond %{QUERY_STRING} !(^|&)hl=(ru|uz|en|zh|tr)(&|$)
RewriteRule ^/(?:(?:uz|en|zh|tr)/)?(?:about|contact)$ http://127.0.0.1:8001%{REQUEST_URI} [P,L]

# directory: «Страны», их «Показать ещё», «Партнёры» и страницы видов партнёров
# (python/savdex/web/directory.py). «Показать ещё» под throttle:60,1 —
# счётчик общий с Laravel, в его файловом кэше (savdex/web/throttle.py)
RewriteCond expr "osenv('SAVDEX_PY_PAGES') =~ /(^|,) *directory *(,|$)/"
RewriteCond expr "%{HTTP_HOST} == osenv('SAVDEX_HOST')"
RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
RewriteCond %{QUERY_STRING} !(^|&)hl=(ru|uz|en|zh|tr)(&|$)
RewriteRule ^/(?:(?:uz|en|zh|tr)/)?(?:countries|partners|partners/(?:general|regular|multi)|countries/[A-Za-z]{2}/companies)$ http://127.0.0.1:8001%{REQUEST_URI} [P,L]

# legal: оферта и другие юридические документы (python/savdex/web/legal.py)
RewriteCond expr "osenv('SAVDEX_PY_PAGES') =~ /(^|,) *legal *(,|$)/"
RewriteCond expr "%{HTTP_HOST} == osenv('SAVDEX_HOST')"
RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
RewriteCond %{QUERY_STRING} !(^|&)hl=(ru|uz|en|zh|tr)(&|$)
RewriteRule ^/(?:(?:uz|en|zh|tr)/)?(?:terms|payment|security|privacy|refunds)$ http://127.0.0.1:8001%{REQUEST_URI} [P,L]

# pricing: тарифы (python/savdex/web/pricing.py). С промокодом (?promo=)
# — Laravel: проверка кода считает попытки с адреса, то есть пишет
RewriteCond expr "osenv('SAVDEX_PY_PAGES') =~ /(^|,) *pricing *(,|$)/"
RewriteCond expr "%{HTTP_HOST} == osenv('SAVDEX_HOST')"
RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
RewriteCond %{QUERY_STRING} !(^|&)hl=(ru|uz|en|zh|tr)(&|$)
RewriteCond %{QUERY_STRING} !(^|&)promo=
RewriteRule ^/(?:(?:uz|en|zh|tr)/)?pricing$ http://127.0.0.1:8001%{REQUEST_URI} [P,L]

# home: главная (python/savdex/web/home.py) — «/» и «/uz», «/en/» и т. д.
RewriteCond expr "osenv('SAVDEX_PY_PAGES') =~ /(^|,) *home *(,|$)/"
RewriteCond expr "%{HTTP_HOST} == osenv('SAVDEX_HOST')"
RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
RewriteCond %{QUERY_STRING} !(^|&)hl=(ru|uz|en|zh|tr)(&|$)
RewriteRule ^/(?:(?:uz|en|zh|tr)/?)?$ http://127.0.0.1:8001%{REQUEST_URI} [P,L]

# С главной — служебное для поисковиков (python/savdex/web/seo_files.py):
# robots.txt площадки и карта сайта. robots.txt домена мини-сайтов — Laravel
RewriteCond expr "osenv('SAVDEX_PY_PAGES') =~ /(^|,) *home *(,|$)/"
RewriteCond expr "%{HTTP_HOST} == osenv('SAVDEX_HOST')"
RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
RewriteRule ^/(?:(?:uz|en|zh|tr)/)?(?:robots\.txt|sitemap\.xml|sitemap-[a-z0-9-]+\.xml)$ http://127.0.0.1:8001%{REQUEST_URI} [P,L]

# reviews: «Все отзывы» (python/savdex/web/reviews.py). Форма
# «Оцените SavdEx» (/reviews/new) — в группе auth, её отправка — в forms
RewriteCond expr "osenv('SAVDEX_PY_PAGES') =~ /(^|,) *reviews *(,|$)/"
RewriteCond expr "%{HTTP_HOST} == osenv('SAVDEX_HOST')"
RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
RewriteCond %{QUERY_STRING} !(^|&)hl=(ru|uz|en|zh|tr)(&|$)
RewriteRule ^/(?:(?:uz|en|zh|tr)/)?reviews$ http://127.0.0.1:8001%{REQUEST_URI} [P,L]

# services: «Резюме» и лента «IT-услуги» и их страницы, страницы
# направлений «Доп. услуг» /services/<направление>
# (python/savdex/web/resumes.py, it_tasks.py, services.py; счётчик просмотров — у
# Django право только на него). Файлы задач /it-services/files/<id> и
# отклик — Laravel
RewriteCond expr "osenv('SAVDEX_PY_PAGES') =~ /(^|,) *services *(,|$)/"
RewriteCond expr "%{HTTP_HOST} == osenv('SAVDEX_HOST')"
RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
RewriteCond %{QUERY_STRING} !(^|&)hl=(ru|uz|en|zh|tr)(&|$)
RewriteRule ^/(?:(?:uz|en|zh|tr)/)?(?:resumes|resume/[^/]+|it-services(?:/[^/]+)?|services/(?:it|hr|recruitment|logistics|customs|accounting))$ http://127.0.0.1:8001%{REQUEST_URI} [P,L]

# companies: каталог компаний, визитка /company/<адрес> и мини-сайт
# /s/<адрес> (python/savdex/web/companies.py, company.py, microsite.py), под throttle:120,1 —
# счётчик общий с Laravel. Визитка пишет «Кто мной интересуется»
# (audience_views, у Django право только на вставку)
RewriteCond expr "osenv('SAVDEX_PY_PAGES') =~ /(^|,) *companies *(,|$)/"
RewriteCond expr "%{HTTP_HOST} == osenv('SAVDEX_HOST')"
RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
RewriteCond %{QUERY_STRING} !(^|&)hl=(ru|uz|en|zh|tr)(&|$)
RewriteRule ^/(?:(?:uz|en|zh|tr)/)?(?:companies|company/[^/]+|s/[a-z0-9-]+)$ http://127.0.0.1:8001%{REQUEST_URI} [P,L]

# Мини-сайты на поддоменах (MICROSITE_DOMAIN, python/savdex/web/microsite.py):
# «/» поддомена — сам сайт, «/» домена — в каталог компаний. Остальные
# адреса этого домена (404, robots.txt, файлы) — как раньше
RewriteCond expr "osenv('SAVDEX_PY_PAGES') =~ /(^|,) *companies *(,|$)/"
RewriteCond expr "-n osenv('MICROSITE_DOMAIN')"
RewriteCond expr "%{HTTP_HOST} == osenv('MICROSITE_DOMAIN') || %{HTTP_HOST} -strmatch '*.' . osenv('MICROSITE_DOMAIN')"
RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
RewriteCond %{QUERY_STRING} !(^|&)hl=(ru|uz|en|zh|tr)(&|$)
RewriteRule ^/(?:(?:uz|en|zh|tr)/?)?$ http://127.0.0.1:8001%{REQUEST_URI} [P,L]

# catalog: каталог объявлений целиком и страница объявления
# (python/savdex/web/catalog.py, listing.py), throttle:120,1; считают
# показы, просмотры и поисковые запросы (у Django право только на
# счётчики), и картинка превью /og/listing/<id>.jpg (og_image.py: JPEG
# собирается один раз и кэшируется рядом с картинками объявления)
RewriteCond expr "osenv('SAVDEX_PY_PAGES') =~ /(^|,) *catalog *(,|$)/"
RewriteCond expr "%{HTTP_HOST} == osenv('SAVDEX_HOST')"
RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
RewriteCond %{QUERY_STRING} !(^|&)hl=(ru|uz|en|zh|tr)(&|$)
RewriteRule ^/(?:(?:uz|en|zh|tr)/)?(?:catalog|listing/[^/]+|og/listing/[0-9]{1,18}\.jpg)$ http://127.0.0.1:8001%{REQUEST_URI} [P,L]

# tenders: закупки (python/savdex/web/tenders.py) — старый адрес ленты
# /tenders (301 в каталог), страница закупки /tenders/<адрес> (счётчик
# просмотров, у Django право только на него) и вкладка «Тендеры»
# каталога: /catalog с type=tender, и только когда type в адресе один —
# иначе PHP возьмёт последний, и вкладка может оказаться объявлениями
RewriteCond expr "osenv('SAVDEX_PY_PAGES') =~ /(^|,) *tenders *(,|$)/"
RewriteCond expr "%{HTTP_HOST} == osenv('SAVDEX_HOST')"
RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
RewriteCond %{QUERY_STRING} !(^|&)hl=(ru|uz|en|zh|tr)(&|$)
RewriteRule ^/(?:(?:uz|en|zh|tr)/)?tenders(?:/[^/]+)?$ http://127.0.0.1:8001%{REQUEST_URI} [P,L]

RewriteCond expr "osenv('SAVDEX_PY_PAGES') =~ /(^|,) *tenders *(,|$)/"
RewriteCond expr "%{HTTP_HOST} == osenv('SAVDEX_HOST')"
RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
RewriteCond %{QUERY_STRING} !(^|&)hl=(ru|uz|en|zh|tr)(&|$)
RewriteCond %{QUERY_STRING} (^|&)type=tender(&|$)
RewriteCond %{QUERY_STRING} !(^|&)[^&=]*type[^&=]*=.*&[^&=]*type[^&=]*=
RewriteRule ^/(?:(?:uz|en|zh|tr)/)?catalog$ http://127.0.0.1:8001%{REQUEST_URI} [P,L]

# cabinet: страницы кабинета, открываемые GET-запросом (этап 5,
# python/savdex/web/cabinet.py): сводка, аналитика, «Кто интересуется»,
# отзывы, мои контакты, настройки, уведомления, избранное, мои
# объявления, чаты и разговор, продвижение, резюме, профиль компании,
# IT-задачи (список и форма), редактор мини-сайта, касса и печатный
# счёт (этап 7, только чтение), шаги мастера
# объявления (/create заводит черновик — это Laravel).
# Перед страницей Django сам проверяет вход и смену пароля, как auth и
# RequirePasswordChange у Laravel; разговор отмечает прочитанное сам
# (права роли — только на время прочтения); формы кабинета — Laravel
RewriteCond expr "osenv('SAVDEX_PY_PAGES') =~ /(^|,) *cabinet *(,|$)/"
RewriteCond expr "%{HTTP_HOST} == osenv('SAVDEX_HOST')"
RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
RewriteCond %{QUERY_STRING} !(^|&)hl=(ru|uz|en|zh|tr)(&|$)
RewriteRule ^/(?:(?:uz|en|zh|tr)/)?(?:cabinet(?:/analytics|/incoming|/reviews|/contacts|/settings|/listings(?:/[0-9]+/edit)?|/chats(?:/[0-9]+)?|/promo|/resume|/company|/site(?:/preview)?|/billing(?:/invoice/[0-9]{1,18})?|/it-tasks(?:/create|/[0-9]+/edit)?)?|notifications|favorites)$ http://127.0.0.1:8001%{REQUEST_URI} [P,L]

# auth: вход, регистрация и пароль — страницы, открываемые GET-запросом
# (этап 5, python/savdex/web/auth.py): вход, регистрация, «Забыли
# пароль», новый пароль по ссылке из письма, ожидание подтверждения
# почты, смена выданного пароля, второй шаг регистрации (компания),
# форма «Оцените SavdEx». Посредники guest, auth и RequirePasswordChange
# Django проверяет сам; сами формы (POST) и ссылка из письма
# /verify-email/<id>/<hash> — группа forms ниже; шаги регистрации
# /register/code и /register/details — Laravel (/register — первый шаг)
RewriteCond expr "osenv('SAVDEX_PY_PAGES') =~ /(^|,) *auth *(,|$)/"
RewriteCond expr "%{HTTP_HOST} == osenv('SAVDEX_HOST')"
RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
RewriteCond %{QUERY_STRING} !(^|&)hl=(ru|uz|en|zh|tr)(&|$)
RewriteRule ^/(?:(?:uz|en|zh|tr)/)?(?:login|register|forgot-password|reset-password/[^/]+|verify-email|password/change|onboarding/company|reviews/new)$ http://127.0.0.1:8001%{REQUEST_URI} [P,L]

# payments: колбэки шлюза Uzum (этап 7, шаг 54, python/savdex/web/
# payment_callbacks.py) — Merchant API /payments/uzum/callback/<операция>
# и вебхук кассы /payments/<провайдер>/callback. Это приём денег: группа
# отдельная от forms, чтобы выключать её отдельно — убрать payments из
# SAVDEX_PY_PAGES, без выкладки (по умолчанию включена)
RewriteCond expr "osenv('SAVDEX_PY_PAGES') =~ /(^|,) *payments *(,|$)/"
RewriteCond expr "%{HTTP_HOST} == osenv('SAVDEX_HOST')"
RewriteCond %{REQUEST_METHOD} ^POST$
RewriteRule ^/(?:(?:uz|en|zh|tr)/)?payments/[a-z]+/callback(?:/[a-z]+)?$ http://127.0.0.1:8001%{REQUEST_URI} [P,L]

# forms: формы кабинета (этап 5, python/savdex/web/actions.py и
# listing_actions.py): прочтение уведомлений, избранное, настройки
# уведомлений, смена языка, «Мои объявления» (продлить, снять, заново,
# удалить, пачкой), «Мои контакты» (статус и заметка, жалоба, выгрузка
# CSV — GET, но с общим счётчиком частоты), ответ на отзыв и спор,
# чат (сообщение, отклик на объявление и IT-задачу), свои IT-задачи
# (закрыть, выполнено, открыть снова, удалить задачу и файл), своё
# резюме (правка, опубликовать, скрыть, удалить), профиль в настройках, привязка
# Telegram (токен — в общий файловый кэш, его забирает вебхук Laravel),
# контакты, профиль, логотип и обложка своей компании, мини-сайт
# (адрес и оформление, публикация, фон, товары), фото объявления, мастер
# (новый черновик — GET, но с записью; автосохранение; публикация), раскрытие
# контактов и отзыв на визитке, файлы компании, продвижение, IT-задача (новая и правка:
# правку с файлами браузер шлёт POST с _method — Django подменяет метод
# сам, как Laravel), вход, выход, регистрация, пароль и почта (смена, сброс,
# код и ссылка из письма — GET), второй шаг регистрации и его пропуск,
# «Оцените SavdEx», удаление учётки, данные компании в настройках (JSON:
# GET, PATCH и обращение в поддержку), касса (заказ, промокод, оплата
# счёта онлайн, автопродление, отвязка карты, отказ от счёта — этап 7). Токен CSRF, вход и частоту Django проверяет
# сам, как Laravel. Метод — ровно как у маршрута Laravel; POST с _method
# (подмена метода) — правилами ниже, тоже Django. По умолчанию группа включена —
# выключается, если убрать forms из SAVDEX_PY_PAGES
RewriteCond expr "osenv('SAVDEX_PY_PAGES') =~ /(^|,) *forms *(,|$)/"
RewriteCond expr "%{HTTP_HOST} == osenv('SAVDEX_HOST')"
RewriteCond %{REQUEST_METHOD} ^POST$
RewriteRule ^/(?:(?:uz|en|zh|tr)/)?(?:notifications/(?:[0-9]{1,18}/read|read-all)|favorites/[0-9]{1,18}|locale/(?:ru|uz|en|zh|tr)|cabinet/listings/(?:bulk|[0-9]{1,18}/(?:renew|archive|resubmit|publish|autosave|images(?:/[0-9]{1,18}/cover)?))|cabinet/contacts/[0-9]{1,18}/complaint|cabinet/reviews/[0-9]{1,18}/(?:reply|dispute)|cabinet/chats/[0-9]{1,18}|(?:listing|it-services)/[0-9]{1,18}/respond|cabinet/it-tasks(?:/[0-9]{1,18}(?:/(?:close|complete|reopen))?)?|cabinet/resume/(?:publish|hide|photo)|cabinet/settings/telegram|cabinet/company/(?:contacts|logo|cover|files)|cabinet/promo|login|logout|register|forgot-password|reset-password|password/change|verify-email/code|email/verification-notification|onboarding/(?:company|skip)|reviews/new|cabinet/settings/delete|cabinet/settings/company-info/support|telegram/webhook/[A-Za-z0-9_-]{8,64}|company/[^/]+/(?:unlock|review)|cabinet/site/(?:publish|unpublish|hero|products(?:/[0-9]{1,18})?)|cabinet/billing/(?:order|promo|cancel|resume|invoice/[0-9]{1,18}/(?:cancel|pay)))$ http://127.0.0.1:8001%{REQUEST_URI} [P,L]
RewriteCond expr "osenv('SAVDEX_PY_PAGES') =~ /(^|,) *forms *(,|$)/"
RewriteCond expr "%{HTTP_HOST} == osenv('SAVDEX_HOST')"
RewriteCond %{REQUEST_METHOD} ^DELETE$
RewriteRule ^/(?:(?:uz|en|zh|tr)/)?cabinet/(?:listings/[0-9]{1,18}(?:/images/[0-9]{1,18})?|it-tasks/[0-9]{1,18}(?:/files/[0-9]{1,18})?|resume|settings/telegram|company/(?:contacts|files)/[0-9]{1,18}|company/(?:logo|cover)|site/hero|site/products/[0-9]{1,18}|billing/card/[0-9]{1,18})$ http://127.0.0.1:8001%{REQUEST_URI} [P,L]
RewriteCond expr "osenv('SAVDEX_PY_PAGES') =~ /(^|,) *forms *(,|$)/"
RewriteCond expr "%{HTTP_HOST} == osenv('SAVDEX_HOST')"
RewriteCond %{REQUEST_METHOD} ^PATCH$
RewriteRule ^/(?:(?:uz|en|zh|tr)/)?cabinet/(?:settings/(?:notifications|profile|company-info)|contacts/[0-9]{1,18}|company/(?:contacts|files)/[0-9]{1,18}|it-tasks/[0-9]{1,18}|resume|company|site)$ http://127.0.0.1:8001%{REQUEST_URI} [P,L]

# Подмена метода (POST с _method или X-HTTP-Method-Override), как её
# понимает Laravel: те же адреса, что PATCH и DELETE выше. Django подменяет
# метод сам (savdex/web/forms.py, MethodOverrideMiddleware); раньше такие
# запросы уходили в Laravel и писали мимо Django (этап 4, шаг 62)
RewriteCond expr "osenv('SAVDEX_PY_PAGES') =~ /(^|,) *forms *(,|$)/"
RewriteCond expr "%{HTTP_HOST} == osenv('SAVDEX_HOST')"
RewriteCond %{REQUEST_METHOD} ^POST$
RewriteRule ^/(?:(?:uz|en|zh|tr)/)?cabinet/(?:listings/[0-9]{1,18}(?:/images/[0-9]{1,18})?|it-tasks/[0-9]{1,18}(?:/files/[0-9]{1,18})?|resume|settings/telegram|company/(?:contacts|files)/[0-9]{1,18}|company/(?:logo|cover)|site/hero|site/products/[0-9]{1,18}|billing/card/[0-9]{1,18})$ http://127.0.0.1:8001%{REQUEST_URI} [P,L]
RewriteCond expr "osenv('SAVDEX_PY_PAGES') =~ /(^|,) *forms *(,|$)/"
RewriteCond expr "%{HTTP_HOST} == osenv('SAVDEX_HOST')"
RewriteCond %{REQUEST_METHOD} ^POST$
RewriteRule ^/(?:(?:uz|en|zh|tr)/)?cabinet/(?:settings/(?:notifications|profile|company-info)|contacts/[0-9]{1,18}|company/(?:contacts|files)/[0-9]{1,18}|it-tasks/[0-9]{1,18}|resume|company|site)$ http://127.0.0.1:8001%{REQUEST_URI} [P,L]
RewriteCond expr "osenv('SAVDEX_PY_PAGES') =~ /(^|,) *forms *(,|$)/"
RewriteCond expr "%{HTTP_HOST} == osenv('SAVDEX_HOST')"
RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
RewriteRule ^/(?:(?:uz|en|zh|tr)/)?(?:cabinet/(?:contacts/export|listings/create|settings/company-info)|files/[0-9]{1,18}|it-services/files/[0-9]{1,18}|verify-email/[^/]+/[^/]+)$ http://127.0.0.1:8001%{REQUEST_URI} [P,L]
