# Apache перед Django (этап 8 переноса, docs/migration-to-python.md).
#
# Laravel в образе больше нет: всё, что приходит на сайт, обслуживает
# Django — два отдельных процесса gunicorn (их запускает
# docker/render-entrypoint.sh): сайт на 127.0.0.1:8001 и админка
# (/py/admin/, вход и выход /py/login, /py/logout) на 127.0.0.1:8002.
# Упавшая или занятая тяжёлой выгрузкой админка отвечает 502/503 только
# на своих адресах — витрина работает дальше. Сам Apache отдаёт только готовые файлы
# из public/: собранный фронтенд (build/), загрузки (storage/ — ссылка
# на постоянный диск), картинки, шрифты, favicon.
#
# Раньше здесь был распределитель: список адресов, которые Django
# забирал у Laravel по группам (переменная SAVDEX_PY_PAGES). Он больше
# не нужен — Django отвечает на всё, включая 404 (savdex/web/fallback.py).
#
# retry=0: если Django перезапускается, Apache не выжидает минуту
# перед следующей попыткой, а пробует на следующем же запросе.
# timeout — как Timeout у Apache (130 с, render-entrypoint.sh).

ProxyRequests Off
ProxyPreserveHost On

<Proxy "http://127.0.0.1:8001/">
    ProxySet retry=0 timeout=130
</Proxy>

<Proxy "http://127.0.0.1:8002/">
    ProxySet retry=0 timeout=130
</Proxy>

# Правила перезаписи виртуальные хосты сами не наследуют — InheritDown
# передаёт их вниз, в сайт из sites-enabled.
RewriteEngine On
RewriteOptions InheritDown

# /index.php/<адрес> Laravel принимал как <адрес>. Такие ссылки могли
# остаться в закладках и выдаче — уводим на чистый адрес (этап 4, шаг 62)
RewriteRule ^/index\.php(/.+)$ $1 [R=301,L,NE]

# Хвостовой «/» — на адрес без него, как public/.htaccess у Laravel
# («Redirect Trailing Slashes If Not A Folder»). Кроме разделов Django
# /py/…: у её адресов «/» в конце — часть адреса
RewriteCond %{REQUEST_URI} !^/py/
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
RewriteRule ^(.+)/$ $1 [R=301,L,NE]

# Готовый файл из public/ — Apache сам, Django он не нужен
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -f
RewriteRule ^ - [L]

# Адрес передаётся как пришёл (THE_REQUEST), без раскодирования: %2F
# и прочее Django разбирает сам.
#
# Админка — в свой процесс. Решает раскодированный путь (REQUEST_URI),
# а передаётся сырой: /py/%61dmin/ Django понимает как /py/admin/ и
# должен попасть туда же
RewriteCond %{REQUEST_URI} ^/py/(?:admin(?:/|$)|log(?:in|out)$)
RewriteCond %{THE_REQUEST} ^\S+\s(/[^?\s]*)
RewriteRule ^ http://127.0.0.1:8002%1 [P,L,NE]

# Всё остальное — сайт
RewriteCond %{THE_REQUEST} ^\S+\s(/[^?\s]*)
RewriteRule ^ http://127.0.0.1:8001%1 [P,L,NE]
